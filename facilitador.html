<!DOCTYPE html>
<html lang="pt-br" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facilitador de Atendimento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4fa;
      color: #0b1a2e;
      padding: 20px 20px 0 20px;
      transition: background 0.25s, color 0.2s;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    [data-theme="dark"] body {
      background: #121926;
      color: #e6edf5;
    }

    /* --- SCROLL ÁREA PRINCIPAL (apenas o conteúdo rola, não a página toda) --- */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 20px;
      margin-right: -8px;
      padding-right: 8px;
    }
    .scroll-area::-webkit-scrollbar {
      width: 6px;
    }
    .scroll-area::-webkit-scrollbar-track {
      background: transparent;
    }
    .scroll-area::-webkit-scrollbar-thumb {
      background: #c0cbd8;
      border-radius: 10px;
    }
    [data-theme="dark"] .scroll-area::-webkit-scrollbar-thumb {
      background: #3b4a62;
    }

    .layout {
      max-width: 1260px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      align-items: flex-start;
    }

    .container, .sidebar {
      background: #ffffff;
      border-radius: 24px;
      padding: 28px 26px;
      box-shadow: 0 8px 28px rgba(0, 20, 40, 0.06);
      transition: background 0.25s, box-shadow 0.2s;
    }
    [data-theme="dark"] .container,
    [data-theme="dark"] .sidebar {
      background: #1e293b;
      box-shadow: 0 8px 28px rgba(0,0,0,0.4);
    }
    .container { flex: 2; min-width: 360px; }
    .sidebar { flex: 1.2; min-width: 300px; }

    .titulo-com-botao {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      gap: 12px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
    }
    h1::before { content: "📋"; font-size: 26px; }

    .limpar-titulo-btn {
      background: transparent;
      border: 1px solid #dce4ed;
      border-radius: 40px;
      padding: 6px 12px;
      font-size: 14px;
      color: #798ea5;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    [data-theme="dark"] .limpar-titulo-btn {
      border-color: #3b4a62;
      color: #8fa3be;
    }
    .limpar-titulo-btn:hover {
      background: #eef2f6;
      color: #1f3349;
    }
    [data-theme="dark"] .limpar-titulo-btn:hover {
      background: #2d3a4f;
      color: #d6e0ee;
    }
    .limpar-titulo-btn:active {
      transform: scale(0.95);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .sidebar-header h2 {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sidebar-header h2::before { content: "⚡"; font-size: 20px; }

    .header-actions {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .header-actions button {
      background: transparent;
      border: 1px solid #dce4ed;
      border-radius: 40px;
      padding: 6px 10px;
      font-size: 16px;
      font-weight: 500;
      color: #1f3349;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-width: 36px;
      height: 36px;
    }
    [data-theme="dark"] .header-actions button {
      border-color: #3b4a62;
      color: #b8c9e0;
    }
    .header-actions button:hover { background: #e3eaf3; }
    [data-theme="dark"] .header-actions button:hover { background: #2a3750; }
    
    #editModeToggle.active {
      background: #1a4cff;
      color: white;
      border-color: #1a4cff;
    }
    [data-theme="dark"] #editModeToggle.active {
      background: #1a4cff;
      color: white;
      border-color: #1a4cff;
    }
    #editModeToggle.active:hover { background: #0e3fd6; }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .theme-toggle {
      background: #eef2f6;
      border: none;
      border-radius: 40px;
      padding: 8px 18px;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #1f3349;
      transition: 0.2s;
    }
    [data-theme="dark"] .theme-toggle {
      background: #2d3a4f;
      color: #d6e0ee;
    }
    .theme-toggle:hover { background: #dce4ed; }
    [data-theme="dark"] .theme-toggle:hover { background: #3b4a62; }

    label {
      display: block;
      font-weight: 500;
      font-size: 14px;
      margin-top: 20px;
      margin-bottom: 5px;
      color: #1f3349;
    }
    [data-theme="dark"] label { color: #b8c9e0; }

    input, textarea, select {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      font-size: 14px;
      font-family: inherit;
      background: #fafcff;
      transition: 0.15s;
      resize: vertical;
    }
    [data-theme="dark"] input,
    [data-theme="dark"] textarea,
    [data-theme="dark"] select {
      background: #0f1729;
      border-color: #3b4a62;
      color: #e6edf5;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #2d7aff;
      outline: none;
      box-shadow: 0 0 0 4px rgba(45, 122, 255, 0.12);
    }
    textarea { min-height: 72px; }

    .radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 18px 30px;
      margin-top: 4px;
    }
    .radio-group label {
      font-weight: 400;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .radio-group input[type="radio"] {
      width: 18px; height: 18px;
      accent-color: #2d7aff;
      margin: 0;
      cursor: pointer;
    }

    .versao-fields {
      display: none;
      gap: 14px;
      margin-top: 12px;
      background: #f2f6fe;
      padding: 16px 18px 14px;
      border-radius: 18px;
      flex-wrap: wrap;
    }
    [data-theme="dark"] .versao-fields { background: #1f2a3e; }
    .versao-fields.show { display: flex; }
    .versao-fields > div { flex: 1 1 130px; }
    .versao-fields label { margin-top: 0; font-size: 13px; }

    .conditional-fields {
      display: none;
      margin-top: 12px;
      background: #f2f6fe;
      padding: 16px 18px 14px;
      border-radius: 18px;
    }
    [data-theme="dark"] .conditional-fields {
      background: #1f2a3e;
    }
    .conditional-fields label {
      margin-top: 0;
      font-size: 13px;
    }
    .conditional-fields.show {
      display: block;
    }

    button {
      font-family: inherit;
      font-weight: 600;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.2s;
    }

    #gerarBtn {
      margin-top: 30px;
      background: #1a4cff;
      color: white;
      padding: 16px 20px;
      font-size: 16px;
      width: 100%;
      border-radius: 60px;
      box-shadow: 0 4px 12px rgba(26, 76, 255, 0.25);
    }
    #gerarBtn:hover { background: #0e3fd6; transform: scale(1.01); }

    .popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 20, 40, 0.45);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }
    .popup-overlay.ativo { display: flex; }
    .popup-card {
      background: #fff;
      max-width: 740px;
      width: 100%;
      border-radius: 32px;
      padding: 32px 34px 26px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.25);
      animation: popIn 0.25s ease;
    }
    [data-theme="dark"] .popup-card { background: #1e293b; color: #e6edf5; }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.96) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .popup-header h2 { font-size: 20px; }
    .popup-header button {
      background: transparent;
      font-size: 28px;
      line-height: 1;
      color: #52677a;
      padding: 0 6px;
      border-radius: 40px;
    }
    [data-theme="dark"] .popup-header button { color: #9ab0cc; }
    .popup-header button:hover { background: #eef3f9; }
    [data-theme="dark"] .popup-header button:hover { background: #2d3a4f; }
    #popupTexto {
      width: 100%;
      min-height: 200px;
      padding: 16px 18px;
      border-radius: 20px;
      border: 1.5px solid #e2e8f0;
      font-size: 14px;
      font-family: 'Inter', monospace;
      line-height: 1.6;
      background: #f8faff;
      resize: vertical;
    }
    [data-theme="dark"] #popupTexto {
      background: #0f1729;
      border-color: #3b4a62;
      color: #e6edf5;
    }
    .popup-acoes {
      display: flex;
      gap: 14px;
      margin-top: 18px;
      flex-wrap: wrap;
    }
    .popup-acoes button {
      padding: 12px 26px;
      font-size: 14px;
      border-radius: 60px;
      flex: 1 1 auto;
    }
    #copiarPopupBtn { background: #16a34a; color: white; }
    #copiarPopupBtn:hover { background: #0f8a3b; }
    #fecharPopupBtn { background: #eef2f6; color: #1f3349; }
    [data-theme="dark"] #fecharPopupBtn { background: #2d3a4f; color: #d6e0ee; }
    #fecharPopupBtn:hover { background: #dce4ed; }
    [data-theme="dark"] #fecharPopupBtn:hover { background: #3b4a62; }
    #copiadoPopupMsg {
      color: #16a34a;
      font-weight: 500;
      font-size: 14px;
      margin-left: 8px;
      display: none;
    }

    .atalho-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      margin: 6px 0 10px;
    }
    .atalho-item {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #f2f7fe;
      border-radius: 40px;
      padding: 4px 6px 4px 12px;
      border: 1px solid #e2edfd;
      transition: 0.15s;
      min-width: 0;
      cursor: default;
    }
    [data-theme="dark"] .atalho-item {
      background: #1f2a3e;
      border-color: #3b4a62;
    }
    .atalho-item:hover { background: #e8f0fe; border-color: #b6cef5; }
    [data-theme="dark"] .atalho-item:hover { background: #2a3750; border-color: #5a6f8f; }

    .atalho-btn {
      flex: 1;
      background: transparent;
      padding: 6px 4px;
      font-size: 13px;
      font-weight: 500;
      color: #0b2b50;
      display: flex;
      align-items: center;
      gap: 6px;
      border-radius: 40px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      border: none;
    }
    [data-theme="dark"] .atalho-btn { color: #d6e0ee; }
    .atalho-btn:hover { background: rgba(45, 122, 255, 0.06); }
    .atalho-icon { flex-shrink: 0; font-size: 14px; }

    .vazio-msg {
      font-size: 14px;
      color: #798ea5;
      padding: 10px 0 6px;
    }
    [data-theme="dark"] .vazio-msg { color: #8fa3be; }

    #ioFeedback {
      font-size: 13px;
      margin-top: 6px;
      display: none;
      padding: 4px 12px;
      border-radius: 40px;
    }
    #ioFeedback.ok { background: #e6f7ec; color: #0a6b34; display: block; }
    #ioFeedback.erro { background: #fee9e7; color: #b91c1c; display: block; }
    [data-theme="dark"] #ioFeedback.ok { background: #1a3a2a; color: #7be0a0; }
    [data-theme="dark"] #ioFeedback.erro { background: #3a1f1f; color: #f7a8a8; }

    /* ----- BLOCO DE NOTAS FLUTUANTE (fixo, sem scroll) ----- */
    .sticky-note-float {
      position: fixed;
      min-width: 200px;
      min-height: 120px;
      width: 380px;
      height: 300px;
      background: #ffffff;
      border-radius: 20px;
      padding: 16px 18px 14px;
      box-shadow: 0 12px 48px rgba(0, 20, 40, 0.2);
      z-index: 500;
      transition: background 0.25s, box-shadow 0.2s;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(2px);
      cursor: default;
      user-select: none;
      resize: both;
      overflow: hidden;
      touch-action: none;
      display: flex;
      flex-direction: column;
    }
    [data-theme="dark"] .sticky-note-float {
      background: #1e293b;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
      border-color: #3b4a62;
    }

    .sticky-note-float::after {
      content: "⤡";
      position: absolute;
      bottom: 4px;
      right: 6px;
      font-size: 14px;
      color: #a0b3c9;
      cursor: nwse-resize;
      opacity: 0.5;
      transition: opacity 0.2s;
      pointer-events: auto;
      z-index: 10;
    }
    .sticky-note-float:hover::after { opacity: 1; }
    [data-theme="dark"] .sticky-note-float::after { color: #5a6f8f; }

    .sticky-note-float.minimizado {
      min-height: 48px;
      height: 48px !important;
      overflow: hidden;
      resize: none;
    }
    .sticky-note-float.minimizado::after { display: none; }
    .sticky-note-float.minimizado .sticky-body { display: none; }
    .sticky-note-float.minimizado .sticky-header .minimizar-btn { transform: rotate(180deg); }

    .sticky-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      cursor: grab;
      touch-action: none;
      padding: 2px 0;
      flex-shrink: 0;
    }
    .sticky-header:active { cursor: grabbing; }
    .sticky-header label {
      font-size: 13px;
      font-weight: 600;
      color: #52677a;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: grab;
      user-select: none;
    }
    [data-theme="dark"] .sticky-header label { color: #8fa3be; }
    .sticky-header label::before { content: "📝"; font-size: 16px; }
    .sticky-actions {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }
    .sticky-actions button {
      background: transparent;
      border: none;
      font-size: 14px;
      color: #798ea5;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 20px;
      transition: 0.15s;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      user-select: none;
    }
    .sticky-actions button:hover {
      background: #eef2f6;
      color: #1f3349;
    }
    [data-theme="dark"] .sticky-actions button:hover {
      background: #2d3a4f;
      color: #d6e0ee;
    }
    .sticky-actions .minimizar-btn { transition: transform 0.3s ease; }

    .sticky-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
    }

    .sticky-body textarea {
      flex: 1;
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      font-size: 13px;
      font-family: inherit;
      background: #fafff7;
      resize: none;
      transition: 0.15s;
      color: #0b1a2e;
      cursor: text;
      user-select: text;
      min-height: 40px;
      height: 100%;
      box-sizing: border-box;
    }
    [data-theme="dark"] .sticky-body textarea {
      background: #0f1729;
      border-color: #3b4a62;
      color: #e6edf5;
    }
    .sticky-body textarea:focus {
      border-color: #2d7aff;
      outline: none;
      box-shadow: 0 0 0 4px rgba(45, 122, 255, 0.08);
    }
    .sticky-body textarea::placeholder {
      color: #a0b3c9;
      font-style: italic;
    }

    .sticky-status {
      font-size: 11px;
      color: #8fa3be;
      margin-top: 4px;
      text-align: right;
      opacity: 0.7;
      transition: opacity 0.3s;
      user-select: none;
      flex-shrink: 0;
      padding-right: 20px;
    }

    /* ============================================== */
    /* === CALCULADORA DE HORÁRIOS FLUTUANTE === */
    /* ============================================== */

    .calc-toggle-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a4cff, #2d7aff);
      color: white;
      border: none;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(26, 76, 255, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
      z-index: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .calc-toggle-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 30px rgba(26, 76, 255, 0.45);
    }
    .calc-toggle-btn.active {
      background: #e74c3c;
      transform: rotate(45deg);
    }
    .calc-toggle-btn.active:hover {
      transform: rotate(45deg) scale(1.08);
    }

    .calc-panel {
      position: fixed;
      bottom: 98px;
      right: 28px;
      width: 320px;
      background: #ffffff;
      border-radius: 20px;
      padding: 20px 22px 22px;
      box-shadow: 0 16px 60px rgba(0, 20, 40, 0.2);
      z-index: 550;
      display: none;
      opacity: 0;
      transform: translateY(12px);
      border: 1px solid rgba(255,255,255,0.2);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    [data-theme="dark"] .calc-panel {
      background: #1e293b;
      box-shadow: 0 16px 60px rgba(0, 0, 0, 0.5);
      border-color: #3b4a62;
    }
    .calc-panel.aberto {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .calc-panel h3 {
      font-size: 14px;
      font-weight: 600;
      color: #1f3349;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    [data-theme="dark"] .calc-panel h3 { color: #d6e0ee; }
    .calc-panel h3::before { content: "⏰"; font-size: 18px; }

    .calc-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
    }
    .calc-row label {
      font-size: 12px;
      font-weight: 500;
      color: #52677a;
      margin: 0;
      min-width: 36px;
    }
    [data-theme="dark"] .calc-row label { color: #8fa3be; }
    .calc-row input[type="time"] {
      flex: 1;
      padding: 8px 10px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', monospace;
      background: #fafcff;
      transition: 0.15s;
      min-width: 0;
    }
    [data-theme="dark"] .calc-row input[type="time"] {
      background: #0f1729;
      border-color: #3b4a62;
      color: #e6edf5;
    }
    .calc-row input[type="time"]:focus {
      border-color: #2d7aff;
      outline: none;
      box-shadow: 0 0 0 3px rgba(45, 122, 255, 0.12);
    }
    .calc-row input[type="number"] {
      width: 48px;
      padding: 8px 4px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      font-family: 'Inter', monospace;
      background: #fafcff;
      transition: 0.15s;
    }
    [data-theme="dark"] .calc-row input[type="number"] {
      background: #0f1729;
      border-color: #3b4a62;
      color: #e6edf5;
    }
    .calc-row input[type="number"]:focus {
      border-color: #2d7aff;
      outline: none;
      box-shadow: 0 0 0 3px rgba(45, 122, 255, 0.12);
    }
    .calc-row span {
      font-size: 13px;
      color: #52677a;
      font-weight: 500;
    }
    [data-theme="dark"] .calc-row span { color: #8fa3be; }

    .calc-resultado {
      margin-top: 12px;
      padding: 12px 14px;
      background: #f2f7fe;
      border-radius: 12px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #1a4cff;
      font-family: 'Inter', monospace;
      letter-spacing: 1px;
    }
    [data-theme="dark"] .calc-resultado {
      background: #1f2a3e;
      color: #5a8aff;
    }

    .calc-comparacao {
      font-size: 13px;
      color: #52677a;
      margin-top: 6px;
      text-align: center;
      min-height: 20px;
    }
    [data-theme="dark"] .calc-comparacao { color: #8fa3be; }
    .calc-comparacao .atraso { color: #e74c3c; font-weight: 600; }
    .calc-comparacao .adiantado { color: #27ae60; font-weight: 600; }

    .calc-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .calc-actions button {
      flex: 1;
      padding: 8px 12px;
      font-size: 13px;
      border-radius: 40px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }
    .calc-calcular-btn {
      background: #1a4cff;
      color: white;
    }
    .calc-calcular-btn:hover { background: #0e3fd6; }
    .calc-limpar-btn {
      background: #eef2f6;
      color: #1f3349;
    }
    [data-theme="dark"] .calc-limpar-btn { background: #2d3a4f; color: #d6e0ee; }
    .calc-limpar-btn:hover { background: #dce4ed; }
    [data-theme="dark"] .calc-limpar-btn:hover { background: #3b4a62; }

    .edit-popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 20, 40, 0.5);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .edit-popup-overlay.ativo { display: flex; }
    .edit-popup-card {
      background: #fff;
      max-width: 480px;
      width: 100%;
      border-radius: 32px;
      padding: 28px 30px 24px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.3);
      animation: popIn 0.2s ease;
    }
    [data-theme="dark"] .edit-popup-card { background: #1e293b; color: #e6edf5; }
    .edit-popup-card h3 {
      font-size: 19px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .edit-popup-card label {
      font-size: 13px;
      margin-top: 14px;
      margin-bottom: 4px;
    }
    .edit-popup-card input, .edit-popup-card select, .edit-popup-card textarea {
      background: #fafcff;
      border-radius: 40px;
      padding: 10px 16px;
      border: 1.5px solid #e2e8f0;
      width: 100%;
      font-family: inherit;
      font-size: 14px;
    }
    [data-theme="dark"] .edit-popup-card input,
    [data-theme="dark"] .edit-popup-card select,
    [data-theme="dark"] .edit-popup-card textarea {
      background: #0f1729;
      border-color: #3b4a62;
      color: #e6edf5;
    }
    .edit-actions {
      display: flex;
      gap: 12px;
      margin-top: 22px;
      flex-wrap: wrap;
    }
    .edit-actions button {
      flex: 1;
      padding: 12px 16px;
      border-radius: 60px;
      font-size: 14px;
      min-width: 100px;
    }
    #salvarEditBtn { background: #1a4cff; color: white; }
    #salvarEditBtn:hover { background: #0e3fd6; }
    #excluirEditBtn { background: #e74c3c; color: white; }
    #excluirEditBtn:hover { background: #c0392b; }
    #cancelarEditBtn { background: #eef2f6; color: #1f3349; }
    [data-theme="dark"] #cancelarEditBtn { background: #2d3a4f; color: #d6e0ee; }
    #cancelarEditBtn:hover { background: #dce4ed; }
    [data-theme="dark"] #cancelarEditBtn:hover { background: #3b4a62; }
    #editFeedback {
      font-size: 13px;
      color: #b91c1c;
      margin-top: 10px;
      display: none;
    }

    @media (max-width: 860px) {
      .layout { flex-direction: column; }
      .container, .sidebar { min-width: 0; }
      .atalho-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
      .sidebar-header { flex-direction: column; align-items: stretch; }
      .header-actions { justify-content: flex-start; flex-wrap: wrap; }
      .sticky-note-float {
        width: 300px !important;
        min-width: 160px;
        height: 250px !important;
      }
      .calc-panel {
        width: 280px;
        right: 16px;
        bottom: 90px;
      }
      .calc-toggle-btn {
        bottom: 20px;
        right: 16px;
        width: 48px;
        height: 48px;
        font-size: 20px;
      }
      .titulo-com-botao {
        flex-wrap: wrap;
      }
    }
    @media (max-width: 480px) {
      .atalho-grid { grid-template-columns: 1fr 1fr; }
      .popup-card, .edit-popup-card { padding: 20px 16px; }
      .header-actions button { font-size: 14px; padding: 4px 8px; min-width: 32px; height: 32px; }
      .sticky-note-float {
        width: 260px !important;
        min-width: 140px;
        height: 200px !important;
        padding: 12px 12px 10px;
      }
      .sticky-body textarea { font-size: 12px; padding: 8px 12px; }
      .calc-panel {
        width: 260px !important;
        right: 10px;
        bottom: 80px;
        padding: 16px;
      }
      .calc-toggle-btn {
        width: 44px;
        height: 44px;
        font-size: 18px;
        bottom: 16px;
        right: 10px;
      }
    }
    /* ===== CRONÔMETROS FLUTUANTES (mesmo tamanho do botão de relógio ⏰, coladinho na borda) ===== */
    .cronometro-fab {
      position: fixed;
      bottom: 28px;
      right: 92px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #3d6bff;
      color: #fff;
      border: none;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(26, 76, 255, 0.28);
      z-index: 1500;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .cronometro-fab:hover { transform: scale(1.06); box-shadow: 0 6px 18px rgba(26,76,255,0.38); }
    .cronometro-fab:active { transform: scale(0.94); }

    /* Alinhado ao mesmo "right" do botão ⏰ (calc-toggle-btn), para ficar
       coladinho na borda direita de verdade, e não na borda do botão ⏱. */
    .cronometros-container {
      position: fixed;
      bottom: 92px;
      right: 28px;
      display: flex;
      flex-direction: column-reverse;
      gap: 6px;
      z-index: 1400;
      max-height: 28vh;
      overflow-y: auto;
      padding: 2px;
      align-items: flex-end;
    }
    @media (max-width: 860px) {
      .cronometro-fab {
        bottom: 20px;
        right: 72px;
        width: 48px;
        height: 48px;
        font-size: 19px;
      }
      .cronometros-container {
        bottom: 76px;
        right: 16px;
        max-height: 26vh;
      }
    }
    @media (max-width: 480px) {
      .cronometro-fab {
        bottom: 16px;
        right: 62px;
        width: 44px;
        height: 44px;
        font-size: 17px;
      }
      .cronometros-container {
        bottom: 68px;
        right: 10px;
        max-height: 24vh;
      }
    }

    /* ===== AVISO VISUAL DE CRONÔMETRO (reforço caso a notificação do sistema falhe) ===== */
    .cronometro-toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: #1a4cff;
      color: #fff;
      padding: 12px 20px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(26,76,255,0.4);
      font-size: 14px;
      font-weight: 500;
      z-index: 3000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .cronometro-toast.ativo {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .cronometro-card {
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(6px);
      border-radius: 12px;
      padding: 6px 8px 6px 12px;
      width: auto;
      max-width: 190px;
      box-shadow: 0 4px 14px rgba(0,20,40,0.10);
      border: 1px solid rgba(11,26,46,0.08);
      transition: box-shadow 0.3s, border-color 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    [data-theme="dark"] .cronometro-card {
      background: rgba(30,41,59,0.92);
      border-color: rgba(255,255,255,0.08);
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    .cronometro-card.cronometro-pausado { opacity: 0.6; }
    .cronometro-card.cronometro-notificado {
      border-color: #1a4cff;
      box-shadow: 0 0 0 2px rgba(26,76,255,0.3), 0 4px 14px rgba(0,20,40,0.10);
    }
    .cronometro-card-main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }
    .cronometro-card-header {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .cronometro-nome {
      font-size: 10.5px;
      font-weight: 600;
      color: #52677a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100px;
    }
    [data-theme="dark"] .cronometro-nome { color: #93a6bd; }
    .cronometro-tempo {
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.2px;
      color: #0b1a2e;
      line-height: 1.2;
    }
    [data-theme="dark"] .cronometro-tempo { color: #e6edf5; }
    .cronometro-acoes { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
    .cronometro-pausar,
    .cronometro-fechar {
      background: transparent;
      border: none;
      color: #8fa3be;
      font-size: 13px;
      cursor: pointer;
      line-height: 1;
      padding: 5px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cronometro-pausar:hover { background: #eef2f6; color: #1f3349; }
    .cronometro-fechar:hover { background: #eef2f6; color: #d64545; }
    [data-theme="dark"] .cronometro-pausar:hover,
    [data-theme="dark"] .cronometro-fechar:hover { background: #2d3a4f; color: #d6e0ee; }

    .cronometro-popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(11, 26, 46, 0.45);
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .cronometro-popup-overlay.ativo { display: flex; }
    .cronometro-popup-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px 24px 20px;
      width: 320px;
      max-width: 90vw;
      box-shadow: 0 16px 40px rgba(0,20,40,0.25);
    }
    [data-theme="dark"] .cronometro-popup-card { background: #1e293b; }
    .cronometro-popup-card h3 {
      font-size: 17px;
      margin-bottom: 14px;
      color: #0b1a2e;
    }
    [data-theme="dark"] .cronometro-popup-card h3 { color: #e6edf5; }
    .cronometro-popup-card label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #1f3349;
    }
    [data-theme="dark"] .cronometro-popup-card label { color: #b8c9e0; }
    .cronometro-popup-card input[type="text"] {
      width: 100%;
      border: 1px solid #dce4ed;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 6px;
      background: #f9fbfd;
      color: inherit;
    }
    [data-theme="dark"] .cronometro-popup-card input[type="text"] {
      border-color: #3b4a62;
      background: #16202f;
    }
    .cronometro-popup-feedback {
      font-size: 12px;
      color: #d64545;
      min-height: 16px;
      margin-bottom: 10px;
    }
    .cronometro-popup-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .cronometro-popup-actions button {
      border-radius: 30px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #cronometroIniciarBtn { background: #1a4cff; color: #fff; border: none; }
    #cronometroIniciarBtn:hover { background: #0e3fd6; }
    #cronometroCancelarBtn { background: transparent; border: 1px solid #dce4ed; color: #1f3349; }
    [data-theme="dark"] #cronometroCancelarBtn { border-color: #3b4a62; color: #b8c9e0; }
  </style>
</head>
<body>

<!-- TEMA TOGGLE no topo -->
<div class="top-bar">
  <button class="theme-toggle" id="themeToggle">🌓 Tema escuro</button>
</div>

<!-- ÁREA COM SCROLL APENAS NO CONTEÚDO -->
<div class="scroll-area">
  <div class="layout">
    <!-- COLUNA PRINCIPAL -->
    <div class="container">
      <div class="titulo-com-botao">
        <h1>Gerador de Atendimento</h1>
        <button class="limpar-titulo-btn" id="limparTituloBtn" title="Limpar todos os campos">🧹 Limpar</button>
      </div>
      <form id="form">
        <label for="solicitacao">Solicitação ou problema</label>
        <input type="text" id="solicitacao" placeholder="Ex: Dúvidas operacionais">

        <label for="solucao">Solução</label>
        <textarea id="solucao" placeholder="Descreva a solução aplicada..."></textarea>

        <label>Tem haver com os últimos 3 chamados?</label>
        <div class="radio-group">
          <label><input type="radio" name="chamados" value="Sim"> Sim</label>
          <label><input type="radio" name="chamados" value="Não" checked> Não</label>
        </div>

        <label>Existiu ou foi necessário kanban?</label>
        <div class="radio-group">
          <label>
            <input type="radio" name="kanban" value="Sim" onchange="mostrarKanban()">
            Sim
          </label>
          <label>
            <input type="radio" name="kanban" value="Não" onchange="mostrarKanban()" checked>
            Não
          </label>
        </div>

        <div id="kanbanFields" class="conditional-fields">
          <label for="kanbanMotivo">Por que foi necessário o Kanban?</label>
          <textarea id="kanbanMotivo" name="kanbanMotivo" placeholder="Explique o motivo pelo qual foi necessário o Kanban..."></textarea>
        </div>

        <label>Efetuou ligação?</label>
        <div class="radio-group">
          <label>
            <input type="radio" name="ligacao" value="Sim" onchange="mostrarLigacao()">
            Sim
          </label>
          <label>
            <input type="radio" name="ligacao" value="Não" onchange="mostrarLigacao()" checked>
            Não
          </label>
        </div>

        <div id="ligacaoFields" class="conditional-fields">
          <label for="ligacaoMotivo">Por que foi necessário efetuar ligação?</label>
          <textarea id="ligacaoMotivo" name="ligacaoMotivo" placeholder="Explique o motivo da ligação..."></textarea>
        </div>

        <label>Foi realizado atualização?</label>
        <div class="radio-group">
          <label><input type="radio" name="atualizacao" value="Sim"> Sim</label>
          <label><input type="radio" name="atualizacao" value="Não" checked> Não</label>
        </div>

        <div class="versao-fields" id="versaoFields">
          <div><label for="versaoDe">Versão de</label><input type="text" id="versaoDe" placeholder="Ex: 4295"></div>
          <div><label for="versaoPara">Para</label><input type="text" id="versaoPara" placeholder="Ex: 4659"></div>
        </div>

        <label>Cliente vinculado?</label>
        <div class="radio-group">
          <label><input type="radio" name="vinculado" value="Sim" checked> Sim</label>
          <label><input type="radio" name="vinculado" value="Não"> Não</label>
        </div>

        <button type="button" id="gerarBtn">✨ Gerar texto</button>
      </form>
    </div>

    <!-- COLUNA ATALHOS -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Atalhos rápidos</h2>
        <div class="header-actions">
          <button id="novoAtalhoBtn" title="Novo atalho">➕</button>
          <button id="editModeToggle" title="Modo edição">✎</button>
          <button id="exportarBtn" title="Exportar atalhos">⬇</button>
          <button id="importarBtn" title="Importar atalhos">⬆</button>
          <input type="file" id="importarInput" accept="application/json" style="display:none">
        </div>
      </div>

      <div id="listaAtalhos" class="atalho-grid"></div>
      <div id="vazioMsg" class="vazio-msg">Nenhum atalho cadastrado.</div>

      <div id="ioFeedback"></div>
    </div>
  </div>
</div>

<!-- BLOCO DE NOTAS FLUTUANTE (FIXED) -->
<div class="sticky-note-float" id="stickyNoteFloat" style="left: auto; right: 28px; bottom: 28px;">
  <div class="sticky-header" id="stickyHeader">
    <label>Bloco de notas</label>
    <div class="sticky-actions">
      <button class="minimizar-btn" id="minimizarStickyBtn" title="Minimizar/Expandir">▼</button>
      <button id="limparStickyBtn" title="Limpar nota">🗑</button>
    </div>
  </div>
  <div class="sticky-body">
    <textarea id="stickyNoteText" placeholder="Digite algo aqui... (salvo automaticamente)"></textarea>
    <div class="sticky-status" id="stickyNoteStatus">Salvo automaticamente</div>
  </div>
</div>

<!-- ============================================= -->
<!-- === CALCULADORA DE HORÁRIOS FLUTUANTE === -->
<!-- ============================================= -->

<!-- Botão para abrir/fechar a calculadora -->
<button class="calc-toggle-btn" id="calcToggleBtn" title="Calculadora de horários">⏰</button>

<!-- Painel da calculadora -->
<div class="calc-panel" id="calcPanel">
  <h3>Calculadora de Horários</h3>
  
  <div class="calc-row">
    <label>Início</label>
    <input type="time" id="calcHoraInicial" value="">
  </div>
  
  <div class="calc-row">
    <label>+</label>
    <input type="number" id="calcHoras" value="1" min="0" max="99" style="width:48px;">
    <span>h</span>
    <input type="number" id="calcMinutos" value="10" min="0" max="59" style="width:48px;">
    <span>min</span>
  </div>

  <div class="calc-row" style="margin-top:6px;">
    <label>Chegou</label>
    <input type="time" id="calcChegada" placeholder="Opcional">
  </div>

  <div class="calc-resultado" id="calcResultado">--:--</div>
  <div class="calc-comparacao" id="calcComparacao">Insira um horário inicial</div>

  <div class="calc-actions">
    <button class="calc-calcular-btn" id="calcCalcularBtn">Calcular</button>
    <button class="calc-limpar-btn" id="calcLimparBtn">Limpar</button>
  </div>
</div>

<!-- ============================================= -->

<!-- POPUP RESULTADO (texto gerado) -->
<div class="popup-overlay" id="popupOverlay">
  <div class="popup-card">
    <div class="popup-header">
      <h2>📄 Texto gerado</h2>
      <button id="fecharPopupX">✕</button>
    </div>
    <textarea id="popupTexto" readonly></textarea>
    <div class="popup-acoes">
      <button id="copiarPopupBtn">📋 Copiar texto</button>
      <button id="fecharPopupBtn">Fechar</button>
      <span id="copiadoPopupMsg">✔ Copiado!</span>
    </div>
  </div>
</div>

<!-- POPUP EDIÇÃO/CRIAÇÃO DE ATALHO (flutuante) -->
<div class="edit-popup-overlay" id="editPopupOverlay">
  <div class="edit-popup-card">
    <h3 id="editPopupTitle">✎ Editar atalho</h3>
    <input type="hidden" id="editId">
    <label for="editNome">Nome</label>
    <input type="text" id="editNome" placeholder="Nome do atalho">
    <label for="editTipo">Ação</label>
    <select id="editTipo">
      <option value="link">Abrir link</option>
      <option value="texto">Copiar texto</option>
    </select>
    <label for="editValorLink">Link / URL</label>
    <input type="url" id="editValorLink" placeholder="https://exemplo.com">
    <label for="editValorTexto" style="display:none" id="editLabelTexto">Texto a copiar</label>
    <textarea id="editValorTexto" placeholder="Texto a copiar" style="display:none"></textarea>
    <div id="editFeedback">Preencha todos os campos.</div>
    <div class="edit-actions">
      <button id="salvarEditBtn">💾 Salvar</button>
      <button id="excluirEditBtn" style="display:none;">🗑 Excluir</button>
      <button id="cancelarEditBtn">Cancelar</button>
    </div>
  </div>
</div>

<!-- CRONÔMETROS FLUTUANTES -->
<div id="cronometrosContainer" class="cronometros-container"></div>

<div class="cronometro-popup-overlay" id="cronometroPopupOverlay">
  <div class="cronometro-popup-card">
    <h3>⏱ Novo cronômetro</h3>
    <label for="cronometroNomeInput">Nome do cronômetro</label>
    <input type="text" id="cronometroNomeInput" placeholder="Ex: Aguardando cliente" maxlength="40">
    <div class="cronometro-popup-feedback" id="cronometroPopupFeedback"></div>
    <div class="cronometro-popup-actions">
      <button id="cronometroCancelarBtn">Cancelar</button>
      <button id="cronometroIniciarBtn">▶ Iniciar</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // ----- TEMA CLARO/ESCURO -----
    const themeToggle = document.getElementById('themeToggle');
    const html = document.documentElement;
    function toggleTheme() {
      const current = html.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      html.setAttribute('data-theme', next);
      themeToggle.textContent = next === 'dark' ? '☀️ Tema claro' : '🌓 Tema escuro';
    }
    themeToggle.addEventListener('click', toggleTheme);
    if (html.getAttribute('data-theme') === 'dark') themeToggle.textContent = '☀️ Tema claro';

    // ----- FUNÇÕES PARA MOSTRAR/ESCONDER CAMPOS CONDICIONAIS -----
    window.mostrarKanban = function() {
      const kanbanSim = document.querySelector('input[name="kanban"][value="Sim"]').checked;
      const campos = document.getElementById("kanbanFields");
      if (kanbanSim) {
        campos.classList.add('show');
      } else {
        campos.classList.remove('show');
      }
    };

    window.mostrarLigacao = function() {
      const ligacaoSim = document.querySelector('input[name="ligacao"][value="Sim"]').checked;
      const campos = document.getElementById("ligacaoFields");
      if (ligacaoSim) {
        campos.classList.add('show');
      } else {
        campos.classList.remove('show');
      }
    };

    // Inicializar os campos condicionais ao carregar a página
    function inicializarCamposCondicionais() {
      mostrarKanban();
      mostrarLigacao();
    }

    // ----- FORMULÁRIO PRINCIPAL (popup) -----
    const gerarBtn = document.getElementById('gerarBtn');
    const limparTituloBtn = document.getElementById('limparTituloBtn');
    const popupOverlay = document.getElementById('popupOverlay');
    const popupTexto = document.getElementById('popupTexto');
    const copiarPopupBtn = document.getElementById('copiarPopupBtn');
    const copiadoPopupMsg = document.getElementById('copiadoPopupMsg');
    const fecharPopupBtn = document.getElementById('fecharPopupBtn');
    const fecharPopupX = document.getElementById('fecharPopupX');

    const atualizacaoRadios = document.querySelectorAll('input[name="atualizacao"]');
    const versaoFields = document.getElementById('versaoFields');
    atualizacaoRadios.forEach(r => {
      r.addEventListener('change', () => {
        const val = document.querySelector('input[name="atualizacao"]:checked').value;
        versaoFields.classList.toggle('show', val === 'Sim');
      });
    });

    function gerarTexto() {
      const solicitacao = document.getElementById('solicitacao').value.trim() || '(não preenchido)';
      const solucao = document.getElementById('solucao').value.trim() || '(não preenchido)';
      const chamados = document.querySelector('input[name="chamados"]:checked').value;
      const kanban = document.querySelector('input[name="kanban"]:checked').value;
      const ligacao = document.querySelector('input[name="ligacao"]:checked').value;
      const atualizacao = document.querySelector('input[name="atualizacao"]:checked').value;
      const vinculado = document.querySelector('input[name="vinculado"]:checked').value;
      
      let blocoKanban = `Foi criado kanban? ${kanban}`;
      if (kanban === 'Sim') {
        const motivo = document.getElementById('kanbanMotivo').value.trim();
        if (motivo) {
          blocoKanban += `\nJustificativa Kanban: ${motivo}`;
        }
      }

      let blocoLigacao = `Efetuou ligação? ${ligacao}`;
      if (ligacao === 'Sim') {
        const motivo = document.getElementById('ligacaoMotivo').value.trim();
        if (motivo) {
          blocoLigacao += `\nJustificativa ligação: ${motivo}`;
        }
      }

      let blocoAtualizacao = `Foi realizado atualização? ${atualizacao}`;
      if (atualizacao === 'Sim') {
        const de = document.getElementById('versaoDe').value.trim();
        const para = document.getElementById('versaoPara').value.trim();
        if (de || para) {
          blocoAtualizacao += `\nVersão: ${de || '(vazio)'} para ${para || '(vazio)'}`;
        }
      }

      const blocos = [
        `Solicitação ou problema: ${solicitacao}`,
        `Solução: ${solucao}`,
        `Tem haver com os últimos 3 chamados? ${chamados}`,
        blocoKanban,
        blocoLigacao,
        blocoAtualizacao,
        `Cliente vinculado? ${vinculado}`
      ];

      // Junta os blocos com APENAS uma quebra de linha entre eles (sem
      // linha em branco), para colar direto no Kanban sem espaçamento extra.
      // No final, garante que nunca fique mais de uma quebra de linha seguida,
      // mesmo que algum valor colado pelo usuário já contenha quebras extras.
      return blocos
        .join('\n')
        .replace(/\n{2,}/g, '\n')
        .trim();
    }

    function mostrarPopup(texto) {
      popupTexto.value = texto;
      popupOverlay.classList.add('ativo');
      copiadoPopupMsg.style.display = 'none';
    }
    gerarBtn.addEventListener('click', () => mostrarPopup(gerarTexto()));

    // ----- BOTÃO LIMPAR CAMPOS (ao lado do título) -----
    function limparCampos() {
      document.getElementById('solicitacao').value = '';
      document.getElementById('solucao').value = '';
      document.getElementById('versaoDe').value = '';
      document.getElementById('versaoPara').value = '';
      document.getElementById('kanbanMotivo').value = '';
      document.getElementById('ligacaoMotivo').value = '';
      
      document.querySelectorAll('input[name="chamados"]').forEach(r => r.checked = r.value === 'Não');
      document.querySelectorAll('input[name="kanban"]').forEach(r => r.checked = r.value === 'Não');
      document.querySelectorAll('input[name="ligacao"]').forEach(r => r.checked = r.value === 'Não');
      document.querySelectorAll('input[name="atualizacao"]').forEach(r => r.checked = r.value === 'Não');
      document.querySelectorAll('input[name="vinculado"]').forEach(r => r.checked = r.value === 'Sim');
      
      versaoFields.classList.remove('show');
      document.getElementById('kanbanFields').classList.remove('show');
      document.getElementById('ligacaoFields').classList.remove('show');
      
      limparTituloBtn.textContent = '✅';
      setTimeout(() => { limparTituloBtn.innerHTML = '🧹 Limpar'; }, 1200);
    }

    limparTituloBtn.addEventListener('click', limparCampos);

    function fecharPopup() { popupOverlay.classList.remove('ativo'); }
    fecharPopupBtn.addEventListener('click', fecharPopup);
    fecharPopupX.addEventListener('click', fecharPopup);
    popupOverlay.addEventListener('click', (e) => { if (e.target === popupOverlay) fecharPopup(); });

    function copiarParaAreaDeTransferencia(texto) {
      return navigator.clipboard.writeText(texto).catch(() => {
        const temp = document.createElement('textarea');
        temp.value = texto;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
      });
    }

    copiarPopupBtn.addEventListener('click', () => {
      copiarParaAreaDeTransferencia(popupTexto.value).then(() => {
        copiadoPopupMsg.style.display = 'inline-block';
        setTimeout(() => { copiadoPopupMsg.style.display = 'none'; }, 2500);
      });
    });

    // ----- ATALHOS EM GRADE -----
    const STORAGE_KEY = 'atalhosRapidos';

    function carregarAtalhos() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
    }
    function salvarAtalhosStorage(lista) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
    }

    let editMode = false;

    function renderizarAtalhos() {
      const lista = carregarAtalhos();
      const container = document.getElementById('listaAtalhos');
      const vazioMsg = document.getElementById('vazioMsg');
      container.innerHTML = '';

      if (lista.length === 0) {
        vazioMsg.style.display = 'block';
        return;
      }
      vazioMsg.style.display = 'none';

      lista.forEach(atalho => {
        const item = document.createElement('div');
        item.className = 'atalho-item';

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'atalho-btn';

    stickyHeader.addEventListener('mousedown', (e) => {
      if (e.target.closest('.sticky-actions')) return;
      isDragging = true;
      const rect = stickyFloat.getBoundingClientRect();
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      
      const style = window.getComputedStyle(stickyFloat);
      startLeft = style.left;
      startTop = style.top;
      startRight = style.right;
      startBottom = style.bottom;
      
      stickyFloat.style.cursor = 'grabbing';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      
      if (startLeft !== 'auto') {
        const leftVal = parseFloat(startLeft) || 0;
        stickyFloat.style.left = (leftVal + dx) + 'px';
        stickyFloat.style.right = 'auto';
      } else if (startRight !== 'auto') {
        const rightVal = parseFloat(startRight) || 0;
        stickyFloat.style.right = (rightVal - dx) + 'px';
        stickyFloat.style.left = 'auto';
      }
      
      if (startTop !== 'auto') {
        const topVal = parseFloat(startTop) || 0;
        stickyFloat.style.top = (topVal + dy) + 'px';
        stickyFloat.style.bottom = 'auto';
      } else if (startBottom !== 'auto') {
        const bottomVal = parseFloat(startBottom) || 0;
        stickyFloat.style.bottom = (bottomVal - dy) + 'px';
        stickyFloat.style.top = 'auto';
      }
      
      e.preventDefault();
    });

    // Função para obter a hora atual com precisão de segundos
    function obterHoraAtualPrecisa() {
      const agora = new Date();
      const horas = String(agora.getHours()).padStart(2, '0');
      const minutos = String(agora.getMinutes()).padStart(2, '0');
      return `${horas}:${minutos}`;
    }

    calcToggleBtn.addEventListener('click', () => {

        calcHoraInicial.value = horaAtual;
        calcularHorario(); // Recalcula automaticamente
      }
    });

    function calcularHorario() {
      const horaInicial = calcHoraInicial.value;
      const horas = parseInt(calcHoras.value) || 0;
      const minutos = parseInt(calcMinutos.value) || 0;

      if (!horaInicial) {
        calcResultado.textContent = '--:--';
        calcComparacao.textContent = '⚠️ Selecione um horário inicial';
        return;
      }

      const partes = horaInicial.split(':');
      let hora = parseInt(partes[0]);
      let minuto = parseInt(partes[1]);

      minuto += minutos;
      hora += horas;

      while (minuto >= 60) { minuto -= 60; hora += 1; }
      while (hora >= 24) { hora -= 24; }

      const horaFormatada = String(hora).padStart(2, '0');
      const minutoFormatado = String(minuto).padStart(2, '0');
      const resultado = `${horaFormatada}:${minutoFormatado}`;
      calcResultado.textContent = resultado;

      const chegada = calcChegada.value;
      if (chegada) {
        function paraMinutos(horaStr) {
          const p = horaStr.split(':');
          return parseInt(p[0]) * 60 + parseInt(p[1]);
        }
        const calcMin = paraMinutos(resultado);
        const chegMin = paraMinutos(chegada);
        const diff = chegMin - calcMin;

        if (diff === 0) {
          calcComparacao.innerHTML = `✅ Chegou no horário exato (${chegada}) 🎯`;
        } else if (diff > 0) {
          const h = Math.floor(diff / 60);
          const m = diff % 60;
          calcComparacao.innerHTML = `⏰ Chegou <span class="atraso">${h}h${String(m).padStart(2,'0')}min ATRASADO</span> (${chegada} vs ${resultado})`;
        } else {
          const diffAbs = Math.abs(diff);
          const h = Math.floor(diffAbs / 60);
          const m = diffAbs % 60;
          calcComparacao.innerHTML = `✅ Chegou <span class="adiantado">${h}h${String(m).padStart(2,'0')}min ADIANTADO</span> (${chegada} vs ${resultado}) 🎉`;
        }
      } else {
        calcComparacao.textContent = `📌 ${horaInicial} + ${horas}h${String(minutos).padStart(2,'0')}min = ${resultado}`;
      }
    }

    calcCalcularBtn.addEventListener('click', calcularHorario);

      if (!('Notification' in window)) return Promise.resolve('unsupported');

      if (Notification.permission === 'denied') return Promise.resolve('denied');
      return Notification.requestPermission();
    }

    function formatarTempo(ms) {
      const totalSeg = Math.floor(ms / 1000);
      const h = Math.floor(totalSeg / 3600);
      const m = Math.floor((totalSeg % 3600) / 60);
      const s = totalSeg % 60;
      const pad = n => String(n).padStart(2, '0');
      return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
    }

    function criarCronometro(nome) {
      const id = ++cronometroIdSeq;
      const cronometro = {
        id,
        name: nome,
        startTs: Date.now(),
        accumulated: 0,
        running: true,
        notifyCount: 0
      };

      const card = document.createElement('div');
      card.className = 'cronometro-card';
      card.dataset.id = String(id);

      const main = document.createElement('div');
      main.className = 'cronometro-card-main';

      const header = document.createElement('div');
      header.className = 'cronometro-card-header';

      const nomeSpan = document.createElement('span');
      nomeSpan.className = 'cronometro-nome';
      nomeSpan.textContent = nome;
      nomeSpan.title = nome;

      header.appendChild(nomeSpan);

      const tempoDiv = document.createElement('div');
      tempoDiv.className = 'cronometro-tempo';
      tempoDiv.textContent = '00:00';

      main.appendChild(header);
      main.appendChild(tempoDiv);

      const acoesDiv = document.createElement('div');
      acoesDiv.className = 'cronometro-acoes';

      const pausarBtn = document.createElement('button');
      pausarBtn.className = 'cronometro-pausar';
      pausarBtn.title = 'Pausar';
      pausarBtn.textContent = '⏸';
      pausarBtn.addEventListener('click', () => togglePausaCronometro(id));

      const fecharBtn = document.createElement('button');
      fecharBtn.className = 'cronometro-fechar';
      fecharBtn.title = 'Remover cronômetro';
      fecharBtn.textContent = '✕';
      fecharBtn.addEventListener('click', () => removerCronometro(id));

      acoesDiv.appendChild(pausarBtn);
      acoesDiv.appendChild(fecharBtn);

      card.appendChild(main);
      card.appendChild(acoesDiv);

      cronometrosContainer.appendChild(card);
      cronometro.el = card;
      cronometro.tempoEl = tempoDiv;
      cronometro.pausarBtnEl = pausarBtn;

      cronometros.push(cronometro);
      atualizarTodosCronometros();
    }

    function togglePausaCronometro(id) {
      const c = cronometros.find(c => c.id === id);
      if (!c) return;
      if (c.running) {
        c.accumulated += Date.now() - c.startTs;
        c.running = false;
        c.pausarBtnEl.textContent = '▶';
        c.pausarBtnEl.title = 'Retomar';
        c.el.classList.add('cronometro-pausado');
      } else {
        c.startTs = Date.now();
        c.running = true;
        c.pausarBtnEl.textContent = '⏸';
        c.pausarBtnEl.title = 'Pausar';
        c.el.classList.remove('cronometro-pausado');
      }
    }

    function removerCronometro(id) {
      const idx = cronometros.findIndex(c => c.id === id);
      if (idx === -1) return;
      cronometros[idx].el.remove();
      cronometros.splice(idx, 1);
    }

    const cronometroToast = document.getElementById('cronometroToast');
    const cronometroBeepAudio = document.getElementById('cronometroBeepAudio');
    let cronometroToastTimeout = null;
    let audioDestravado = false;

    // Alguns navegadores só permitem tocar áudio programaticamente depois de uma
    // interação direta do usuário. Por isso "destravamos" o player assim que o
    // usuário clica em "Iniciar", tocando e pausando instantaneamente em silêncio.
    function destravarAudioCronometro() {
      if (audioDestravado || !cronometroBeepAudio) return;
      const volumeOriginal = cronometroBeepAudio.volume;
      cronometroBeepAudio.volume = 0;
      const p = cronometroBeepAudio.play();
      if (p && typeof p.then === 'function') {
        p.then(() => {
          cronometroBeepAudio.pause();
          cronometroBeepAudio.currentTime = 0;
          cronometroBeepAudio.volume = volumeOriginal;
          audioDestravado = true;
        }).catch(() => {
          cronometroBeepAudio.volume = volumeOriginal;
        });
      } else {
        cronometroBeepAudio.pause();
        cronometroBeepAudio.currentTime = 0;
        cronometroBeepAudio.volume = volumeOriginal;
        audioDestravado = true;
      }
    }

    function tocarBipCronometro() {
      // Tentativa 1: elemento <audio> (mais confiável, sobrevive melhor a
      // políticas de autoplay do que um AudioContext criado fora de um clique).
      if (cronometroBeepAudio) {
        try {
          cronometroBeepAudio.currentTime = 0;
          const p = cronometroBeepAudio.play();
          if (p && typeof p.catch === 'function') {
            p.catch(() => { tocarBipViaOscilador(); });
          }
          return;
        } catch (e) {
          // segue para o fallback abaixo
        }
      }
      tocarBipViaOscilador();
    }

    function tocarBipViaOscilador() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const disparar = () => {
          [0, 0.18].forEach((delay) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 880;
            gain.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
            gain.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + delay + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + 0.16);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + delay);
            osc.stop(ctx.currentTime + delay + 0.18);
          });
          setTimeout(() => ctx.close(), 500);
        };
        if (ctx.state === 'suspended') {
          ctx.resume().then(disparar).catch(() => {});
        } else {
          disparar();
        }
      } catch (e) {
        // ambiente sem suporte a áudio; ignora silenciosamente
      }
    }

    function mostrarToastCronometro(texto) {
      cronometroToast.textContent = texto;
      cronometroToast.classList.add('ativo');
      clearTimeout(cronometroToastTimeout);
      cronometroToastTimeout = setTimeout(() => {
        cronometroToast.classList.remove('ativo');
      }, 4500);
    }

    function notificarCronometro(c, minutos) {
      const titulo = `⏱ ${c.name}`;
      const corpo = `Já se passaram ${minutos} minutos.`;
      let notificacaoOk = false;
      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification(titulo, {
            body: corpo,
            tag: `cronometro-${c.id}-${c.notifyCount}`,
            requireInteraction: true,
            silent: false
          });
          notificacaoOk = true;
        } catch (e) {
          // alguns navegadores (principalmente mobile/Windows com foco assist) bloqueiam
          // "new Notification" silenciosamente — por isso sempre reforçamos com toast + som abaixo.
        }
      }
      // Reforço visual/sonoro sempre ativo, independente da notificação do sistema ter funcionado,
      // pois o SO pode suprimir o balão de notificação sem lançar erro (ex.: Foco Assistido do Windows).
      mostrarToastCronometro(`${titulo} — ${corpo}`);
      tocarBipCronometro();
      c.el.classList.add('cronometro-notificado');
      setTimeout(() => c.el.classList.remove('cronometro-notificado'), 2500);
    }

    function atualizarTodosCronometros() {
      cronometros.forEach(c => {
        const elapsed = c.accumulated + (c.running ? Date.now() - c.startTs : 0);
        c.tempoEl.textContent = formatarTempo(elapsed);
        if (c.running) {
          const intervalosPassados = Math.floor(elapsed / INTERVALO_NOTIFICACAO);
          if (intervalosPassados > c.notifyCount) {
            c.notifyCount = intervalosPassados;
            notificarCronometro(c, intervalosPassados * 5);
          }
        }
      });
    }
    setInterval(atualizarTodosCronometros, 1000);
  })();
</script>
</body>
</html>
