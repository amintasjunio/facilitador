            </div>
        </div>
    </div>

    <!-- ===== MODAL PARA CRIAR/EDITAR MENSAGEM ===== -->
    <div class="modal-overlay" id="modalMsg">
        <div class="modal-card">
            <h3 id="modalTitulo"><i class="fas fa-plus-circle"></i> Nova mensagem</h3>
            <input type="hidden" id="editIndex" value="" />

            <label>Título</label>
            <input type="text" id="modalTituloInput" placeholder="Ex: Atendimento, Encerramento..." maxlength="40" />

            <label>Corpo (use {nome}, {inicio}, {fim})</label>
            <textarea id="modalCorpo" placeholder="Olá {nome}, atendimento de {inicio} a {fim}."></textarea>

            <div class="variaveis-preview">
                <span class="tag-var-modal" data-var="{nome}">{nome} → <strong id="pvNome">(cliente)</strong></span>
                <span class="tag-var-modal" data-var="{inicio}">{inicio} → <strong id="pvInicio">(data)</strong></span>
                <span class="tag-var-modal" data-var="{fim}">{fim} → <strong id="pvFim">(data)</strong></span>
            </div>

            <div class="feedback" id="modalFeedback"></div>

            <div class="modal-actions">
                <button class="btn btn-primary" id="btnSalvarMsg"><i class="fas fa-check"></i> Salvar</button>
                <button class="btn btn-danger" id="btnExcluirMsg" style="display:none;"><i class="fas fa-trash"></i> Excluir</button>
                <button class="btn btn-outline" id="btnCancelarMsg">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- ===== MODAL DE VISUALIZAÇÃO DA MENSAGEM ===== -->
    <div class="view-modal-overlay" id="viewModal">
        <div class="view-modal-card">
            <h3 id="viewTitulo"><i class="fas fa-file-alt"></i> <span id="viewTituloTexto">Mensagem</span></h3>
            <div class="view-subtitle" id="viewSubtitle">Visualização completa</div>
            <div class="view-body" id="viewBody">Carregando...</div>
            <div class="view-modal-actions">
                <button class="btn btn-success" id="viewCopiarBtn"><i class="fas fa-copy"></i> Copiar</button>
                <button class="btn btn-outline" id="viewFecharBtn">Fechar</button>
                <span class="view-feedback" id="viewFeedback"><i class="fas fa-check-circle"></i> Copiado!</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ============================================================
            // TEMA
            // ============================================================
            const themeToggle = document.getElementById('themeToggle');
            const html = document.documentElement;

            function toggleTheme() {
                const current = html.getAttribute('data-theme');
                const next = current === 'light' ? 'dark' : 'light';
                html.setAttribute('data-theme', next);
                themeToggle.textContent = next === 'dark' ? '☀️' : '🌓';
            }
            themeToggle.addEventListener('click', toggleTheme);
            if (html.getAttribute('data-theme') === 'dark') themeToggle.textContent = '☀️';

            // ============================================================
            // TOAST FEEDBACK
            // ============================================================
            const toastFeedback = document.getElementById('toastFeedback');
            let toastTimeout = null;

            function mostrarToast(msg, erro = false) {
                toastFeedback.textContent = msg;
                toastFeedback.className = 'toast-feedback ativo' + (erro ? ' erro' : '');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toastFeedback.classList.remove('ativo');
                }, 3000);
            }

            // ============================================================
            // INSERIR VARIÁVEL NO TEXTO (clique nas tags do modal)
            // ============================================================
            function configurarInserirVariavel(selector, targetId) {
                const elementos = document.querySelectorAll(selector);
                const target = document.getElementById(targetId);
                if (!target) return;

                elementos.forEach(el => {
                    el.addEventListener('click', function(e) {
                        e.preventDefault();
                        const variavel = this.dataset.var || this.textContent.trim();
                        const textarea = target;
                        const start = textarea.selectionStart;
                        const end = textarea.selectionEnd;
                        const texto = textarea.value;
                        const antes = texto.substring(0, start);
                        const depois = texto.substring(end);
                        textarea.value = antes + variavel + depois;
                        const novaPos = start + variavel.length;
                        textarea.selectionStart = novaPos;
                        textarea.selectionEnd = novaPos;
                        textarea.focus();
                        textarea.dispatchEvent(new Event('input'));
                    });
                });
            }

            // ============================================================
            // STORAGE
            // ============================================================
            const KEY_MSGS = 'facilitador_mensagens_v6';
            const KEY_NOTAS = 'facilitador_notas_v6';
            const KEY_CAMPOS = 'facilitador_campos_v6';

            // ============================================================
            // ELEMENTOS
            // ============================================================
            const dataInicio = document.getElementById('dataInicio');
            const dataFim = document.getElementById('dataFim');
            const nomeCliente = document.getElementById('nomeCliente');
            const lista = document.getElementById('listaMensagens');
            const vazioMsg = document.getElementById('vazioMsg');

            // Modal de edição
            const modal = document.getElementById('modalMsg');
            const modalTitulo = document.getElementById('modalTitulo');
            const editIndex = document.getElementById('editIndex');
            const modalTituloInput = document.getElementById('modalTituloInput');
            const modalCorpo = document.getElementById('modalCorpo');
            const modalFeedback = document.getElementById('modalFeedback');
            const btnSalvar = document.getElementById('btnSalvarMsg');
            const btnExcluir = document.getElementById('btnExcluirMsg');
            const btnCancelar = document.getElementById('btnCancelarMsg');

            // Modal de visualização
            const viewModal = document.getElementById('viewModal');
            const viewTituloTexto = document.getElementById('viewTituloTexto');
            const viewSubtitle = document.getElementById('viewSubtitle');
            const viewBody = document.getElementById('viewBody');
            const viewCopiarBtn = document.getElementById('viewCopiarBtn');
            const viewFecharBtn = document.getElementById('viewFecharBtn');
            const viewFeedback = document.getElementById('viewFeedback');

            // Previews
            const pvNome = document.getElementById('pvNome');
            const pvInicio = document.getElementById('pvInicio');
            const pvFim = document.getElementById('pvFim');

            let editandoIndex = null;
            let viewIndex = null;

            // ============================================================
            // FUNÇÕES
            // ============================================================
            function carregarMsgs() {
                try { return JSON.parse(localStorage.getItem(KEY_MSGS)) || []; } catch { return []; }
            }

            function salvarMsgs(lista) {
                localStorage.setItem(KEY_MSGS, JSON.stringify(lista));
            }

            function carregarCampos() {
                try {
                    const d = JSON.parse(localStorage.getItem(KEY_CAMPOS));
                    if (d) {
                        if (d.inicio) dataInicio.value = d.inicio;
                        if (d.fim) dataFim.value = d.fim;
                        if (d.cliente) nomeCliente.value = d.cliente;
                    }
                } catch (e) {}
            }

            function salvarCampos() {
                localStorage.setItem(KEY_CAMPOS, JSON.stringify({
                    inicio: dataInicio.value,
                    fim: dataFim.value,
                    cliente: nomeCliente.value
                }));
            }

            function carregarNotas() {
                try {
                    const n = localStorage.getItem(KEY_NOTAS);
                    if (n !== null) stickyNoteText.value = n;
                } catch (e) {}
            }

            function salvarNotas() {
                localStorage.setItem(KEY_NOTAS, stickyNoteText.value);
                stickyNoteStatus.textContent = 'Salvo ✓';
                stickyNoteStatus.style.opacity = '1';
                clearTimeout(stickyTimeout);
                stickyTimeout = setTimeout(() => {
                    stickyNoteStatus.textContent = 'Salvo automaticamente';
                    stickyNoteStatus.style.opacity = '0.7';
                }, 1500);
            }

            function formatarData(d) {
                if (!d) return '';
                const p = d.split('-');
                if (p.length !== 3) return d;
                return `${p[2]}/${p[1]}/${p[0]}`;
            }

            function getVals() {
                return {
                    nome: nomeCliente.value || '(cliente)',
                    inicio: dataInicio.value ? formatarData(dataInicio.value) : '(data início)',
                    fim: dataFim.value ? formatarData(dataFim.value) : '(data fim)'
                };
            }

            function preencher(template) {
                const v = getVals();
                return template.replace(/{nome}/g, v.nome).replace(/{inicio}/g, v.inicio).replace(/{fim}/g, v.fim);
            }

            function atualizarPreviews() {
                const v = getVals();
                pvNome.textContent = v.nome;
                pvInicio.textContent = v.inicio;
                pvFim.textContent = v.fim;
            }

            // ============================================================
            // RENDERIZAR LISTA (cards)
            // ============================================================
            function renderizar() {
                const msgs = carregarMsgs();
                lista.querySelectorAll('.msg-card').forEach(el => el.remove());

                if (msgs.length === 0) {
                    vazioMsg.style.display = 'block';
                    return;
                }
                vazioMsg.style.display = 'none';

                msgs.forEach((item, idx) => {
                    const card = document.createElement('div');
                    card.className = 'msg-card';
                    card.dataset.index = idx;

                    // Clique no card para visualizar
                    card.addEventListener('click', (e) => {
                        // Se clicou em um botão dentro do card, não abrir visualização
                        if (e.target.closest('.card-acoes')) return;
                        abrirVisualizacao(idx);
                    });

                    const titulo = document.createElement('div');
                    titulo.className = 'card-titulo';
                    titulo.textContent = item.titulo || 'Sem título';
                    titulo.title = item.titulo || '';

                    const preview = document.createElement('div');
                    preview.className = 'card-preview';
                    const corpo = item.corpo || '';
                    preview.textContent = corpo;
                    preview.title = corpo;

                    const acoes = document.createElement('div');
                    acoes.className = 'card-acoes';

                    const btnCopiar = document.createElement('button');
                    btnCopiar.className = 'btn btn-success btn-xs';
                    btnCopiar.innerHTML = '<i class="fas fa-copy"></i>';
                    btnCopiar.title = 'Copiar';
                    btnCopiar.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const texto = preencher(item.corpo || '');
                        copiarTexto(texto, btnCopiar);
                    });

                    const btnEditar = document.createElement('button');
                    btnEditar.className = 'btn btn-outline btn-xs';
                    btnEditar.innerHTML = '<i class="fas fa-pen"></i>';
                    btnEditar.title = 'Editar';
                    btnEditar.addEventListener('click', (e) => {
                        e.stopPropagation();
                        abrirModalEditar(idx);
                    });

                    const btnDel = document.createElement('button');
                    btnDel.className = 'btn btn-danger btn-xs';
                    btnDel.innerHTML = '<i class="fas fa-trash"></i>';
                    btnDel.title = 'Excluir';
                    btnDel.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (confirm('Excluir esta mensagem?')) {
                            excluirMsg(idx);
                        }
                    });

                    acoes.appendChild(btnCopiar);
                    acoes.appendChild(btnEditar);
                    acoes.appendChild(btnDel);

                    card.appendChild(titulo);
                    card.appendChild(preview);
                    card.appendChild(acoes);

                    lista.appendChild(card);
                });
            }

            // ============================================================
            // VISUALIZAÇÃO DA MENSAGEM
            // ============================================================
            function abrirVisualizacao(idx) {
                const msgs = carregarMsgs();
                if (idx < 0 || idx >= msgs.length) return;
                const item = msgs[idx];
                viewIndex = idx;

                const textoCompleto = preencher(item.corpo || '');

                viewTituloTexto.textContent = item.titulo || 'Sem título';
                viewSubtitle.textContent = `Mensagem #${idx + 1} • ${new Date().toLocaleString()}`;
                viewBody.textContent = textoCompleto || '(mensagem vazia)';
                viewFeedback.classList.remove('ativo');
                viewModal.classList.add('ativo');
            }

            function fecharVisualizacao() {
                viewModal.classList.remove('ativo');
                viewIndex = null;
            }

            viewFecharBtn.addEventListener('click', fecharVisualizacao);
            viewModal.addEventListener('click', (e) => {
                if (e.target === viewModal) fecharVisualizacao();
            });

            viewCopiarBtn.addEventListener('click', () => {
                const texto = viewBody.textContent;
                if (texto && texto !== '(mensagem vazia)') {
                    copiarTexto(texto, viewCopiarBtn);
                    viewFeedback.classList.add('ativo');
                    setTimeout(() => {
                        viewFeedback.classList.remove('ativo');
                    }, 2000);
                }
            });

            // ============================================================
            // CRUD
            // ============================================================
            function salvarNova(titulo, corpo) {
                const lista = carregarMsgs();
                lista.push({ titulo: titulo.trim(), corpo: corpo.trim() });
                salvarMsgs(lista);
                renderizar();
            }

            function atualizarMsg(idx, titulo, corpo) {
                const lista = carregarMsgs();
                if (idx >= 0 && idx < lista.length) {
                    lista[idx] = { titulo: titulo.trim(), corpo: corpo.trim() };
                    salvarMsgs(lista);
                    renderizar();
                }
            }

            function excluirMsg(idx) {
                const lista = carregarMsgs();
                if (idx >= 0 && idx < lista.length) {
                    lista.splice(idx, 1);
                    salvarMsgs(lista);
                    renderizar();
                }
            }

            // ============================================================
            // EXPORT / IMPORT
            // ============================================================
            document.getElementById('btnExportar').addEventListener('click', () => {
                const msgs = carregarMsgs();
                if (msgs.length === 0) {
                    mostrarToast('Nenhuma mensagem para exportar.', true);
                    return;
                }
                const blob = new Blob([JSON.stringify(msgs, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `mensagens_${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                mostrarToast(`${msgs.length} mensagem(ns) exportada(s)!`);
            });

            document.getElementById('btnImportar').addEventListener('click', () => {
                document.getElementById('importarInput').click();
            });

            document.getElementById('importarInput').addEventListener('change', (ev) => {
                const arquivo = ev.target.files[0];
                if (!arquivo) return;
                const leitor = new FileReader();
                leitor.onload = (e) => {
                    try {
                        const importados = JSON.parse(e.target.result);
                        if (!Array.isArray(importados)) throw new Error('Formato inválido');
                        if (importados.length === 0) throw new Error('Arquivo vazio');

                        const atuais = carregarMsgs();
                        let count = 0;
                        importados.forEach(item => {
                            if (item.titulo && item.corpo) {
                                atuais.push({
                                    titulo: item.titulo.trim(),
                                    corpo: item.corpo.trim()
                                });
                                count++;
                            }
                        });
                        salvarMsgs(atuais);
                        renderizar();
                        mostrarToast(`${count} mensagem(ns) importada(s)!`);
                    } catch (err) {
                        mostrarToast('Erro ao importar: ' + err.message, true);
                    }
                    ev.target.value = '';
                };
                leitor.readAsText(arquivo);
            });

            // ============================================================
            // MODAL DE EDIÇÃO
            // ============================================================
            function abrirModalNovo() {
                editandoIndex = null;
                editIndex.value = '';
                modalTitulo.innerHTML = '<i class="fas fa-plus-circle"></i> Nova mensagem';
                modalTituloInput.value = '';
                modalCorpo.value = '';
                btnExcluir.style.display = 'none';
                modalFeedback.style.display = 'none';
                atualizarPreviews();
                modal.classList.add('ativo');
                setTimeout(() => modalTituloInput.focus(), 80);
            }

            function abrirModalEditar(idx) {
                const lista = carregarMsgs();
                if (idx < 0 || idx >= lista.length) return;
                const item = lista[idx];
                editandoIndex = idx;
                editIndex.value = idx;
                modalTitulo.innerHTML = '<i class="fas fa-edit"></i> Editar mensagem';
                modalTituloInput.value = item.titulo || '';
                modalCorpo.value = item.corpo || '';
                btnExcluir.style.display = 'block';
                modalFeedback.style.display = 'none';
                atualizarPreviews();
                modal.classList.add('ativo');
                setTimeout(() => modalTituloInput.focus(), 80);
            }

            function fecharModal() {
                modal.classList.remove('ativo');
                editandoIndex = null;
            }

            function salvarDoModal() {
                const titulo = modalTituloInput.value.trim();
                const corpo = modalCorpo.value.trim();

                if (!titulo) {
                    modalFeedback.textContent = 'Digite um título.';
                    modalFeedback.style.display = 'block';
                    modalTituloInput.focus();
                    return;
                }
                if (!corpo) {
                    modalFeedback.textContent = 'Digite o corpo da mensagem.';
                    modalFeedback.style.display = 'block';
                    modalCorpo.focus();
                    return;
                }

                modalFeedback.style.display = 'none';

                if (editandoIndex !== null) {
                    atualizarMsg(editandoIndex, titulo, corpo);
                } else {
                    salvarNova(titulo, corpo);
                }
                fecharModal();
            }

            function excluirDoModal() {
                if (editandoIndex === null) return;
                if (confirm('Excluir esta mensagem?')) {
                    excluirMsg(editandoIndex);
                    fecharModal();
                }
            }

            // ============================================================
            // COPIAR TEXTO
            // ============================================================
            function copiarTexto(texto, el) {
                const orig = el.innerHTML;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(texto).then(() => feedbackCopy(el)).catch(() => fallbackCopy(texto, el));
                } else {
                    fallbackCopy(texto, el);
                }

                function feedbackCopy(elem) {
                    elem.innerHTML = '<i class="fas fa-check"></i> Copiado!';
                    setTimeout(() => {
                        if (elem.id === 'viewCopiarBtn') {
                            elem.innerHTML = '<i class="fas fa-copy"></i> Copiar';
                        } else {
                            elem.innerHTML = orig;
                        }
                    }, 1500);
                }

                function fallbackCopy(t, elem) {
                    const temp = document.createElement('textarea');
                    temp.value = t;
                    document.body.appendChild(temp);
                    temp.select();
                    try {
                        document.execCommand('copy');
                        feedbackCopy(elem);
                    } catch (e) {
                        alert('Não foi possível copiar.');
                    }
                    document.body.removeChild(temp);
                }
            }

            // ============================================================
            // EVENTOS
            // ============================================================
            document.getElementById('btnNovaMsg').addEventListener('click', abrirModalNovo);

            document.getElementById('btnLimparVariaveis').addEventListener('click', () => {
                dataInicio.value = '';
                dataFim.value = '';
                nomeCliente.value = '';
                salvarCampos();
                atualizarPreviews();
            });

            btnSalvar.addEventListener('click', salvarDoModal);
            btnExcluir.addEventListener('click', excluirDoModal);
            btnCancelar.addEventListener('click', fecharModal);

            modal.addEventListener('click', (e) => {
                if (e.target === modal) fecharModal();
            });

            // Auto-salvar
            function autoSalvar() {
                salvarCampos();
                salvarNotas();
                atualizarPreviews();
            }

            [dataInicio, dataFim, nomeCliente].forEach(el => {
                el.addEventListener('input', autoSalvar);
            });

            // Atalhos no modal
            modalTituloInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault();
                    modalCorpo.focus(); }
            });
            modalCorpo.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    salvarDoModal();
                }
            });

            // ============================================================
            // CONFIGURAR INSERÇÃO DE VARIÁVEIS POR CLICK (apenas no modal)
            // ============================================================
            configurarInserirVariavel('.tag-var-modal', 'modalCorpo');

            // ============================================================
            // BLOCO DE NOTAS FLUTUANTE
            // ============================================================
            const STICKY_KEY = 'stickyNoteContent';
            const stickyNoteText = document.getElementById('stickyNoteText');
            const stickyNoteStatus = document.getElementById('stickyNoteStatus');
            const limparStickyBtn = document.getElementById('limparStickyBtn');
            const minimizarBtn = document.getElementById('minimizarStickyBtn');
            const stickyFloat = document.getElementById('stickyNoteFloat');
            const stickyHeader = document.getElementById('stickyHeader');
            let stickyTimeout = null;

            function carregarPosicao() {
                try {
                    const pos = JSON.parse(localStorage.getItem('stickyNotePosition'));
                    if (pos) {
                        stickyFloat.style.left = pos.left;
                        stickyFloat.style.right = pos.right;
                        stickyFloat.style.top = pos.top;
                        stickyFloat.style.bottom = pos.bottom;
                    }
                    const size = JSON.parse(localStorage.getItem('stickyNoteSize'));
                    if (size) {
                        stickyFloat.style.width = size.width;
                        stickyFloat.style.height = size.height;
                    }
                } catch (e) { /* ignore */ }
            }

            function salvarPosicao() {
                try {
                    const rect = stickyFloat.getBoundingClientRect();
                    const pos = {
                        left: stickyFloat.style.left,
                        right: stickyFloat.style.right,
                        top: stickyFloat.style.top,
                        bottom: stickyFloat.style.bottom
                    };
                    localStorage.setItem('stickyNotePosition', JSON.stringify(pos));
                    const size = {
                        width: stickyFloat.style.width,
                        height: stickyFloat.style.height
                    };
                    localStorage.setItem('stickyNoteSize', JSON.stringify(size));
                } catch (e) { /* ignore */ }
            }

            function carregarStickyNote() {
                try {
                    const salvo = localStorage.getItem(STICKY_KEY);
                    if (salvo !== null) {
                        stickyNoteText.value = salvo;
                    }
                } catch (e) { /* ignore */ }
            }

            stickyNoteText.addEventListener('input', salvarNotas);

            limparStickyBtn.addEventListener('click', () => {
                if (stickyNoteText.value.trim() === '') return;
                if (confirm('Limpar o conteúdo do bloco de notas?')) {
                    stickyNoteText.value = '';
                    salvarNotas();
                    stickyNoteStatus.textContent = 'Limpo ✓';
                    stickyNoteStatus.style.opacity = '1';
                    setTimeout(() => {
                        stickyNoteStatus.textContent = 'Salvo automaticamente';
                        stickyNoteStatus.style.opacity = '0.7';
                    }, 1500);
                }
            });

            let minimizado = false;
            minimizarBtn.addEventListener('click', () => {
                minimizado = !minimizado;
                stickyFloat.classList.toggle('minimizado', minimizado);
                minimizarBtn.textContent = minimizado ? '▲' : '▼';
                if (!minimizado) {
                    try {
                        const size = JSON.parse(localStorage.getItem('stickyNoteSize'));
                        if (size && size.height) {
                            stickyFloat.style.height = size.height;
                        } else {
                            stickyFloat.style.height = '260px';
                        }
                    } catch (e) {
                        stickyFloat.style.height = '260px';
                    }
                }
                salvarPosicao();
            });

            // ARRASTE
            let isDragging = false;
            let dragStartX, dragStartY;
            let startLeft, startTop, startRight, startBottom;

            stickyHeader.addEventListener('mousedown', (e) => {
                if (e.target.closest('.sticky-actions')) return;
                isDragging = true;
                const rect = stickyFloat.getBoundingClientRect();
                dragStartX = e.clientX;
                dragStartY = e.clientY;

                const style = window.getComputedStyle(stickyFloat);
                startLeft = style.left;
                startTop = style.top;
                startRight = style.right;
                startBottom = style.bottom;

                stickyFloat.style.cursor = 'grabbing';
                document.body.style.userSelect = 'none';
                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;

                const dx = e.clientX - dragStartX;
                const dy = e.clientY - dragStartY;

                if (startLeft !== 'auto') {
                    const leftVal = parseFloat(startLeft) || 0;
                    stickyFloat.style.left = (leftVal + dx) + 'px';
                    stickyFloat.style.right = 'auto';
                } else if (startRight !== 'auto') {
                    const rightVal = parseFloat(startRight) || 0;
                    stickyFloat.style.right = (rightVal - dx) + 'px';
                    stickyFloat.style.left = 'auto';
                }

                if (startTop !== 'auto') {
                    const topVal = parseFloat(startTop) || 0;
                    stickyFloat.style.top = (topVal + dy) + 'px';
                    stickyFloat.style.bottom = 'auto';
                } else if (startBottom !== 'auto') {
                    const bottomVal = parseFloat(startBottom) || 0;
                    stickyFloat.style.bottom = (bottomVal - dy) + 'px';
                    stickyFloat.style.top = 'auto';
                }

                e.preventDefault();
            });

            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    stickyFloat.style.cursor = 'default';
                    document.body.style.userSelect = '';
                    salvarPosicao();
                }
            });

            // TOUCH
            stickyHeader.addEventListener('touchstart', (e) => {
                if (e.target.closest('.sticky-actions')) return;
                const touch = e.touches[0];
                isDragging = true;
                const rect = stickyFloat.getBoundingClientRect();
                dragStartX = touch.clientX;
                dragStartY = touch.clientY;

                const style = window.getComputedStyle(stickyFloat);
                startLeft = style.left;
                startTop = style.top;
                startRight = style.right;
                startBottom = style.bottom;

                document.body.style.userSelect = 'none';
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const touch = e.touches[0];
                const dx = touch.clientX - dragStartX;
                const dy = touch.clientY - dragStartY;

                if (startLeft !== 'auto') {
                    const leftVal = parseFloat(startLeft) || 0;
                    stickyFloat.style.left = (leftVal + dx) + 'px';
                    stickyFloat.style.right = 'auto';
                } else if (startRight !== 'auto') {
                    const rightVal = parseFloat(startRight) || 0;
                    stickyFloat.style.right = (rightVal - dx) + 'px';
                    stickyFloat.style.left = 'auto';
                }

                if (startTop !== 'auto') {
                    const topVal = parseFloat(startTop) || 0;
                    stickyFloat.style.top = (topVal + dy) + 'px';
                    stickyFloat.style.bottom = 'auto';
                } else if (startBottom !== 'auto') {
                    const bottomVal = parseFloat(startBottom) || 0;
                    stickyFloat.style.bottom = (bottomVal - dy) + 'px';
                    stickyFloat.style.top = 'auto';
                }

                e.preventDefault();
            }, { passive: false });

            document.addEventListener('touchend', () => {
                if (isDragging) {
                    isDragging = false;
                    document.body.style.userSelect = '';
                    salvarPosicao();
                }
            });

            function ajustarTextarea() {
                if (!minimizado) {
                    const rect = stickyFloat.getBoundingClientRect();
                    const headerHeight = stickyHeader.getBoundingClientRect().height;
                    const statusHeight = stickyNoteStatus.getBoundingClientRect().height;
                    const padding = 24;
                    const gap = 8;
                    const newHeight = rect.height - headerHeight - statusHeight - padding - gap - 4;

                    if (newHeight > 30) {
                        stickyNoteText.style.height = newHeight + 'px';
                    } else {
                        stickyNoteText.style.height = '30px';
                    }
                }
            }

            const resizeObserver = new ResizeObserver(() => {
                if (!minimizado) {
                    ajustarTextarea();
                    salvarPosicao();
                }
            });
            resizeObserver.observe(stickyFloat);

            window.addEventListener('resize', () => {
                if (!minimizado) {
                    ajustarTextarea();
                }
            });

            setTimeout(ajustarTextarea, 100);
            carregarPosicao();
            carregarStickyNote();

            // ============================================================
            // CALCULADORA
            // ============================================================
            const calcToggleBtn = document.getElementById('calcToggleBtn');
            const calcPanel = document.getElementById('calcPanel');
            const calcHoraInicial = document.getElementById('calcHoraInicial');
            const calcHoras = document.getElementById('calcHoras');
            const calcMinutos = document.getElementById('calcMinutos');
            const calcChegada = document.getElementById('calcChegada');
            const calcResultado = document.getElementById('calcResultado');
            const calcComparacao = document.getElementById('calcComparacao');
            const calcCalcularBtn = document.getElementById('calcCalcularBtn');
            const calcLimparBtn = document.getElementById('calcLimparBtn');

            let calcAberto = false;

            function obterHoraAtualPrecisa() {
                const agora = new Date();
                return String(agora.getHours()).padStart(2, '0') + ':' + String(agora.getMinutes()).padStart(2, '0');
            }

            calcToggleBtn.addEventListener('click', () => {
                calcAberto = !calcAberto;
                calcToggleBtn.classList.toggle('active', calcAberto);
                calcPanel.classList.toggle('aberto', calcAberto);

                if (calcAberto) {
                    calcHoraInicial.value = obterHoraAtualPrecisa();
                    calcularHorario();
                }
            });

            function calcularHorario() {
                const horaInicial = calcHoraInicial.value;
                const horas = parseInt(calcHoras.value) || 0;
                const minutos = parseInt(calcMinutos.value) || 0;

                if (!horaInicial) {
                    calcResultado.textContent = '--:--';
                    calcComparacao.textContent = '⚠️ Selecione um horário inicial';
                    return;
                }

                const partes = horaInicial.split(':');
                let hora = parseInt(partes[0]);
                let minuto = parseInt(partes[1]);

                minuto += minutos;
                hora += horas;

                while (minuto >= 60) { minuto -= 60;
                    hora += 1; }
                while (hora >= 24) { hora -= 24; }

                const resultado = String(hora).padStart(2, '0') + ':' + String(minuto).padStart(2, '0');
                calcResultado.textContent = resultado;

                const chegada = calcChegada.value;
                if (chegada) {
                    function toMin(str) {
                        const p = str.split(':');
                        return parseInt(p[0]) * 60 + parseInt(p[1]);
                    }
                    const diff = toMin(chegada) - toMin(resultado);
                    if (diff === 0) {
                        calcComparacao.innerHTML = `✅ Exato (${chegada})`;
                    } else if (diff > 0) {
                        const h = Math.floor(diff / 60);
                        const m = diff % 60;
                        calcComparacao.innerHTML =
                            `⏰ <span class="atraso">${h}h${String(m).padStart(2,'0')}min ATRASADO</span>`;
                    } else {
                        const d = Math.abs(diff);
                        const h = Math.floor(d / 60);
                        const m = d % 60;
                        calcComparacao.innerHTML =
                            `✅ <span class="adiantado">${h}h${String(m).padStart(2,'0')}min ADIANTADO</span>`;
                    }
                } else {
                    calcComparacao.textContent = `${horaInicial} + ${horas}h${String(minutos).padStart(2,'0')}min = ${resultado}`;
                }
            }

            calcCalcularBtn.addEventListener('click', calcularHorario);
            calcLimparBtn.addEventListener('click', () => {
                calcHoraInicial.value = '';
                calcHoras.value = '';
                calcMinutos.value = '';
                calcChegada.value = '';
                calcResultado.textContent = '--:--';
                calcComparacao.textContent = '';
            });
            document.querySelectorAll('.calc-row input').forEach(el => {
                el.addEventListener('keydown', (e) => { if (e.key === 'Enter') calcularHorario(); });
            });

            // ============================================================
            // CRONÔMETROS (COM INTERVALO CONFIGURÁVEL)
            // ============================================================
            const cronometroFab = document.getElementById('cronometroFab');
            const cronometroPopupOverlay = document.getElementById('cronometroPopupOverlay');
            const cronometroNomeInput = document.getElementById('cronometroNomeInput');
            const cronometroIntervaloInput = document.getElementById('cronometroIntervaloInput');
            const cronometroIniciarBtn = document.getElementById('cronometroIniciarBtn');
            const cronometroCancelarBtn = document.getElementById('cronometroCancelarBtn');
            const cronometroPopupFeedback = document.getElementById('cronometroPopupFeedback');
            const cronometrosContainer = document.getElementById('cronometrosContainer');

            let cronometros = [];
            let cronometroIdSeq = 0;

            function abrirPopupCronometro() {
                cronometroNomeInput.value = '';
                cronometroIntervaloInput.value = 5;
                cronometroPopupFeedback.textContent = '';
                cronometroPopupOverlay.classList.add('ativo');
                setTimeout(() => cronometroNomeInput.focus(), 50);
            }

            function fecharPopupCronometro() {
                cronometroPopupOverlay.classList.remove('ativo');
            }

            cronometroFab.addEventListener('click', abrirPopupCronometro);
            cronometroCancelarBtn.addEventListener('click', fecharPopupCronometro);
            cronometroPopupOverlay.addEventListener('click', (e) => {
                if (e.target === cronometroPopupOverlay) fecharPopupCronometro();
            });
            cronometroNomeInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') iniciarNovoCronometro();
            });
            cronometroIniciarBtn.addEventListener('click', iniciarNovoCronometro);

            function pedirPermissaoNotificacao() {
                if (!('Notification' in window)) return Promise.resolve('unsupported');
                if (Notification.permission === 'granted') return Promise.resolve('granted');
                if (Notification.permission === 'denied') return Promise.resolve('denied');
                return Notification.requestPermission();
            }

            function iniciarNovoCronometro() {
                const nome = cronometroNomeInput.value.trim();
                if (!nome) {
                    cronometroPopupFeedback.textContent = 'Digite um nome.';
                    cronometroNomeInput.focus();
                    return;
                }

                let intervaloMinutos = parseInt(cronometroIntervaloInput.value) || 5;
                if (intervaloMinutos < 1) intervaloMinutos = 1;
                if (intervaloMinutos > 120) intervaloMinutos = 120;

                pedirPermissaoNotificacao().then(() => {
                    destravarAudioCronometro();
                    criarCronometro(nome, intervaloMinutos);
                    fecharPopupCronometro();
                });
            }

            function formatarTempo(ms) {
                const total = Math.floor(ms / 1000);
                const h = Math.floor(total / 3600);
                const m = Math.floor((total % 3600) / 60);
                const s = total % 60;
                const pad = n => String(n).padStart(2, '0');
                return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
            }

            function criarCronometro(nome, intervaloMinutos) {
                const id = ++cronometroIdSeq;
                const cronometro = {
                    id,
                    name: nome,
                    startTs: Date.now(),
                    accumulated: 0,
                    running: true,
                    notifyCount: 0,
                    intervaloMs: intervaloMinutos * 60 * 1000
                };

                const card = document.createElement('div');
                card.className = 'cronometro-card';
                card.dataset.id = String(id);

                const main = document.createElement('div');
                main.className = 'cronometro-card-main';

                const header = document.createElement('div');
                header.className = 'cronometro-card-header';

                const nomeSpan = document.createElement('span');
                nomeSpan.className = 'cronometro-nome';
                nomeSpan.textContent = nome;
                nomeSpan.title = nome;

                header.appendChild(nomeSpan);

                const tempoDiv = document.createElement('div');
                tempoDiv.className = 'cronometro-tempo';
                tempoDiv.textContent = '00:00';

                main.appendChild(header);
                main.appendChild(tempoDiv);

                const acoesDiv = document.createElement('div');
                acoesDiv.className = 'cronometro-acoes';

                const pausarBtn = document.createElement('button');
                pausarBtn.className = 'cronometro-pausar';
                pausarBtn.title = 'Pausar';
                pausarBtn.textContent = '⏸';
                pausarBtn.addEventListener('click', () => togglePausaCronometro(id));

                const fecharBtn = document.createElement('button');
                fecharBtn.className = 'cronometro-fechar';
                fecharBtn.title = 'Remover';
                fecharBtn.textContent = '✕';
                fecharBtn.addEventListener('click', () => removerCronometro(id));

                acoesDiv.appendChild(pausarBtn);
                acoesDiv.appendChild(fecharBtn);

                card.appendChild(main);
                card.appendChild(acoesDiv);

                cronometrosContainer.appendChild(card);
                cronometro.el = card;
                cronometro.tempoEl = tempoDiv;
                cronometro.pausarBtnEl = pausarBtn;

                cronometros.push(cronometro);
                atualizarTodosCronometros();
            }

            function togglePausaCronometro(id) {
                const c = cronometros.find(c => c.id === id);
                if (!c) return;
                if (c.running) {
                    c.accumulated += Date.now() - c.startTs;
                    c.running = false;
                    c.pausarBtnEl.textContent = '▶';
                    c.pausarBtnEl.title = 'Retomar';
                    c.el.classList.add('cronometro-pausado');
                } else {
                    c.startTs = Date.now();
                    c.running = true;
                    c.pausarBtnEl.textContent = '⏸';
                    c.pausarBtnEl.title = 'Pausar';
                    c.el.classList.remove('cronometro-pausado');
                }
            }

            function removerCronometro(id) {
                const idx = cronometros.findIndex(c => c.id === id);
                if (idx === -1) return;
                cronometros[idx].el.remove();
                cronometros.splice(idx, 1);
            }

            const cronometroToast = document.getElementById('cronometroToast');
            const cronometroBeepAudio = document.getElementById('cronometroBeepAudio');
            let cronometroToastTimeout = null;
            let audioDestravado = false;

            function destravarAudioCronometro() {
                if (audioDestravado || !cronometroBeepAudio) return;
                const vol = cronometroBeepAudio.volume;
                cronometroBeepAudio.volume = 0;
                const p = cronometroBeepAudio.play();
                if (p && typeof p.then === 'function') {
                    p.then(() => {
                        cronometroBeepAudio.pause();
                        cronometroBeepAudio.currentTime = 0;
                        cronometroBeepAudio.volume = vol;
                        audioDestravado = true;
                    }).catch(() => { cronometroBeepAudio.volume = vol; });
                } else {
                    cronometroBeepAudio.pause();
                    cronometroBeepAudio.currentTime = 0;
                    cronometroBeepAudio.volume = vol;
                    audioDestravado = true;
                }
            }

            function tocarBipCronometro() {
                if (cronometroBeepAudio) {
                    try {
                        cronometroBeepAudio.currentTime = 0;
                        const p = cronometroBeepAudio.play();
                        if (p && typeof p.catch === 'function') p.catch(() => {});
                        return;
                    } catch (e) {}
                }
                try {
                    const ctx = new(window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = 880;
                    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.2);
                    setTimeout(() => ctx.close(), 500);
                } catch (e) {}
            }

            function mostrarToastCronometro(texto) {
                cronometroToast.textContent = texto;
                cronometroToast.classList.add('ativo');
                clearTimeout(cronometroToastTimeout);
                cronometroToastTimeout = setTimeout(() => {
                    cronometroToast.classList.remove('ativo');
                }, 4500);
            }

            function notificarCronometro(c, minutos) {
                const titulo = `⏱ ${c.name}`;
                const corpo = `Já se passaram ${minutos} minutos.`;
                if ('Notification' in window && Notification.permission === 'granted') {
                    try {
                        new Notification(titulo, {
                            body: corpo,
                            tag: `cronometro-${c.id}-${c.notifyCount}`,
                            requireInteraction: true,
                            silent: false
                        });
                    } catch (e) {}
                }
                mostrarToastCronometro(`${titulo} — ${corpo}`);
                tocarBipCronometro();
                c.el.classList.add('cronometro-notificado');
                setTimeout(() => c.el.classList.remove('cronometro-notificado'), 2500);
            }

            function atualizarTodosCronometros() {
                cronometros.forEach(c => {
                    const elapsed = c.accumulated + (c.running ? Date.now() - c.startTs : 0);
                    c.tempoEl.textContent = formatarTempo(elapsed);

                    if (c.running) {
                        const intervaloMs = c.intervaloMs || 5 * 60 * 1000;
                        const passados = Math.floor(elapsed / intervaloMs);
                        if (passados > c.notifyCount) {
                            c.notifyCount = passados;
                            const minutosDecorridos = passados * (intervaloMs / 60000);
                            notificarCronometro(c, Math.round(minutosDecorridos));
                        }
                    }
                });
            }

            setInterval(atualizarTodosCronometros, 1000);

            // ============================================================
            // INICIALIZAÇÃO GERAL
            // ============================================================
            carregarCampos();
            renderizar();
            atualizarPreviews();

            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                html.setAttribute('data-theme', 'dark');
                themeToggle.textContent = '☀️';
            }

            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }

        })();
    </script>

</body>
</html>
