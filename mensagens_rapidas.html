<!DOCTYPE html>
<html lang="pt-br" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facilitador de Atendimento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== RESET E BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f4fa;
            color: #0b1a2e;
            padding: 0;
            transition: background 0.25s, color 0.2s;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        [data-theme="dark"] body {
            background: #121926;
            color: #e6edf5;
        }

        /* ===== BARRA SUPERIOR FIXA ===== */
        .top-bar {
            background: #ffffff;
            padding: 8px 16px;
            box-shadow: 0 2px 12px rgba(0, 20, 40, 0.06);
            flex-shrink: 0;
            z-index: 100;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            transition: background 0.25s;
            border-bottom: 1px solid #eef2f8;
            min-height: 56px;
        }
        [data-theme="dark"] .top-bar {
            background: #1a2538;
            border-bottom-color: #2d3a4f;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .top-bar .logo {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #0b2b44;
            flex-shrink: 0;
        }
        [data-theme="dark"] .top-bar .logo {
            color: #e6edf5;
        }
        .top-bar .logo i {
            color: #2d7aff;
        }

        .top-bar .variaveis-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            flex: 1;
            min-width: 160px;
        }

        .top-bar .campo-var {
            display: flex;
            flex-direction: column;
            gap: 1px;
            min-width: 70px;
            flex: 1;
        }
        .top-bar .campo-var label {
            font-size: 8px;
            font-weight: 600;
            color: #64748b;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            margin: 0;
        }
        [data-theme="dark"] .top-bar .campo-var label {
            color: #8fa3be;
        }
        .top-bar .campo-var input {
            padding: 3px 8px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 12px;
            background: #fafcff;
            transition: 0.15s;
            color: #0b1a2e;
            width: 100%;
            min-width: 60px;
        }
        [data-theme="dark"] .top-bar .campo-var input {
            background: #0f1729;
            border-color: #3b4a62;
            color: #e6edf5;
        }
        .top-bar .campo-var input:focus {
            border-color: #2d7aff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(45, 122, 255, 0.08);
        }
        .top-bar .campo-var.cliente {
            flex: 1.5;
            min-width: 90px;
        }

        .top-bar .acoes-topo {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .btn {
            padding: 5px 10px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 11px;
            border: none;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #eef2f8;
            color: #1f3349;
        }
        .btn:hover {
            background: #dce4ed;
            transform: scale(0.97);
        }
        .btn i {
            font-size: 12px;
        }
        .btn-primary {
            background: #1a4cff;
            color: white;
            box-shadow: 0 4px 12px rgba(26, 76, 255, 0.2);
        }
        .btn-primary:hover {
            background: #0e3fd6;
        }
        .btn-success {
            background: #16a34a;
            color: white;
        }
        .btn-success:hover {
            background: #0f8a3b;
        }
        .btn-danger {
            background: #dc2626;
            color: white;
        }
        .btn-danger:hover {
            background: #b91c1c;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid #dce4ed;
        }
        .btn-outline:hover {
            background: #f1f5fa;
        }
        .btn-sm {
            padding: 3px 8px;
            font-size: 10px;
        }
        .btn-xs {
            padding: 2px 5px;
            font-size: 9px;
            border-radius: 30px;
        }

        .theme-toggle {
            background: transparent;
            border: 1.5px solid #dce4ed;
            border-radius: 40px;
            padding: 4px 8px;
            font-weight: 500;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
            color: #1f3349;
            transition: 0.2s;
        }
        [data-theme="dark"] .theme-toggle {
            border-color: #3b4a62;
            color: #d6e0ee;
        }
        .theme-toggle:hover {
            background: #eef2f6;
        }
        [data-theme="dark"] .theme-toggle:hover {
            background: #2d3a4f;
        }

        /* ===== ÁREA DE CONTEÚDO ===== */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
        }
        .content-area::-webkit-scrollbar {
            width: 5px;
        }
        .content-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .content-area::-webkit-scrollbar-thumb {
            background: #c0cbd8;
            border-radius: 10px;
        }
        [data-theme="dark"] .content-area::-webkit-scrollbar-thumb {
            background: #3b4a62;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .msg-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 12px 14px;
            box-shadow: 0 4px 16px rgba(0, 20, 40, 0.06);
            border: 1px solid #eef2f8;
            transition: 0.15s;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 80px;
            cursor: pointer;
        }
        [data-theme="dark"] .msg-card {
            background: #1e293b;
            border-color: #2d3a4f;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        .msg-card:hover {
            border-color: #cbd5e1;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 20, 40, 0.08);
        }
        [data-theme="dark"] .msg-card:hover {
            border-color: #4a5a72;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .msg-card .card-titulo {
            font-weight: 600;
            font-size: 12px;
            color: #1a4cff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        [data-theme="dark"] .msg-card .card-titulo {
            color: #5a8aff;
        }

        .msg-card .card-preview {
            font-size: 11px;
            color: #475569;
            flex: 1;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            line-height: 1.4;
            word-break: break-word;
        }
        [data-theme="dark"] .msg-card .card-preview {
            color: #94a3b8;
        }

        .msg-card .card-acoes {
            display: flex;
            gap: 3px;
            justify-content: flex-end;
            border-top: 1px solid #eef2f8;
            padding-top: 6px;
            margin-top: 2px;
        }
        [data-theme="dark"] .msg-card .card-acoes {
            border-top-color: #2d3a4f;
        }

        .vazio-msg {
            color: #94a3b8;
            font-size: 14px;
            padding: 40px 0;
            text-align: center;
            grid-column: 1 / -1;
        }
        [data-theme="dark"] .vazio-msg {
            color: #64748b;
        }

        /* ===== FEEDBACK ===== */
        .toast-feedback {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1a4cff;
            color: #fff;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            z-index: 3000;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s ease;
            box-shadow: 0 8px 24px rgba(26, 76, 255, 0.3);
        }
        .toast-feedback.ativo {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast-feedback.erro {
            background: #dc2626;
            box-shadow: 0 8px 24px rgba(220, 38, 38, 0.3);
        }

        /* ===== BLOCO DE NOTAS FLUTUANTE ===== */
        .sticky-note-float {
            position: fixed;
            min-width: 180px;
            min-height: 100px;
            width: 340px;
            height: 260px;
            background: #ffffff;
            border-radius: 18px;
            padding: 14px 16px 12px;
            box-shadow: 0 12px 48px rgba(0, 20, 40, 0.2);
            z-index: 500;
            transition: background 0.25s, box-shadow 0.2s;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(2px);
            cursor: default;
            user-select: none;
            resize: both;
            overflow: hidden;
            touch-action: none;
            display: flex;
            flex-direction: column;
        }
        [data-theme="dark"] .sticky-note-float {
            background: #1e293b;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
            border-color: #3b4a62;
        }

        .sticky-note-float::after {
            content: "⤡";
            position: absolute;
            bottom: 4px;
            right: 6px;
            font-size: 13px;
            color: #a0b3c9;
            cursor: nwse-resize;
            opacity: 0.5;
            transition: opacity 0.2s;
            pointer-events: auto;
            z-index: 10;
        }
        .sticky-note-float:hover::after {
            opacity: 1;
        }
        [data-theme="dark"] .sticky-note-float::after {
            color: #5a6f8f;
        }

        .sticky-note-float.minimizado {
            min-height: 44px;
            height: 44px !important;
            overflow: hidden;
            resize: none;
        }
        .sticky-note-float.minimizado::after {
            display: none;
        }
        .sticky-note-float.minimizado .sticky-body {
            display: none;
        }
        .sticky-note-float.minimizado .sticky-header .minimizar-btn {
            transform: rotate(180deg);
        }

        .sticky-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 8px;
            cursor: grab;
            touch-action: none;
            padding: 2px 0;
            flex-shrink: 0;
        }
        .sticky-header:active {
            cursor: grabbing;
        }
        .sticky-header label {
            font-size: 12px;
            font-weight: 600;
            color: #52677a;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: grab;
            user-select: none;
        }
        [data-theme="dark"] .sticky-header label {
            color: #8fa3be;
        }
        .sticky-header label::before {
            content: "📝";
            font-size: 14px;
        }
        .sticky-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
        }
        .sticky-actions button {
            background: transparent;
            border: none;
            font-size: 13px;
            color: #798ea5;
            cursor: pointer;
            padding: 3px 5px;
            border-radius: 20px;
            transition: 0.15s;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            user-select: none;
        }
        .sticky-actions button:hover {
            background: #eef2f6;
            color: #1f3349;
        }
        [data-theme="dark"] .sticky-actions button:hover {
            background: #2d3a4f;
            color: #d6e0ee;
        }
        .sticky-actions .minimizar-btn {
            transition: transform 0.3s ease;
        }

        .sticky-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            position: relative;
        }

        .sticky-body textarea {
            flex: 1;
            width: 100%;
            padding: 8px 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 12px;
            font-family: inherit;
            background: #fafff7;
            resize: none;
            transition: 0.15s;
            color: #0b1a2e;
            cursor: text;
            user-select: text;
            min-height: 30px;
            height: 100%;
            box-sizing: border-box;
        }
        [data-theme="dark"] .sticky-body textarea {
            background: #0f1729;
            border-color: #3b4a62;
            color: #e6edf5;
        }
        .sticky-body textarea:focus {
            border-color: #2d7aff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(45, 122, 255, 0.08);
        }
        .sticky-body textarea::placeholder {
            color: #a0b3c9;
            font-style: italic;
        }

        .sticky-status {
            font-size: 10px;
            color: #8fa3be;
            margin-top: 3px;
            text-align: right;
            opacity: 0.7;
            transition: opacity 0.3s;
            user-select: none;
            flex-shrink: 0;
            padding-right: 18px;
        }

        /* ===== MODAL DE EDIÇÃO/CRIAÇÃO ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 20, 40, 0.5);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.ativo {
            display: flex;
        }
        .modal-card {
            background: #fff;
            max-width: 440px;
            width: 100%;
            border-radius: 24px;
            padding: 22px 24px 18px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            animation: modalIn 0.2s ease;
        }
        [data-theme="dark"] .modal-card {
            background: #1e293b;
            color: #e6edf5;
        }
        @keyframes modalIn {
            0% {
                opacity: 0;
                transform: scale(0.96) translateY(8px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-card h3 {
            font-size: 17px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #0b2b44;
        }
        [data-theme="dark"] .modal-card h3 {
            color: #e6edf5;
        }
        .modal-card h3 i {
            color: #2d7aff;
        }
        .modal-card label {
            font-size: 12px;
            font-weight: 500;
            margin-top: 10px;
            margin-bottom: 3px;
            color: #334e6e;
            display: block;
        }
        [data-theme="dark"] .modal-card label {
            color: #b8c9e0;
        }
        .modal-card input,
        .modal-card textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 13px;
            font-family: inherit;
            background: #fafcff;
            color: #0b1a2e;
        }
        [data-theme="dark"] .modal-card input,
        [data-theme="dark"] .modal-card textarea {
            background: #0f1729;
            border-color: #3b4a62;
            color: #e6edf5;
        }
        .modal-card input:focus,
        .modal-card textarea:focus {
            border-color: #2d7aff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(45, 122, 255, 0.08);
        }
        .modal-card textarea {
            min-height: 60px;
            resize: vertical;
        }
        .modal-card .variaveis-preview {
            background: #f1f5f9;
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 11px;
            color: #475569;
            margin-top: 5px;
            display: flex;
            flex-wrap: wrap;
            gap: 3px 10px;
        }
        [data-theme="dark"] .modal-card .variaveis-preview {
            background: #1f2a3e;
            color: #94a3b8;
        }
        .modal-card .variaveis-preview .tag-var-modal {
            background: #e2e8f0;
            padding: 1px 6px;
            border-radius: 30px;
            font-size: 10px;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
            user-select: none;
        }
        .modal-card .variaveis-preview .tag-var-modal:hover {
            background: #cbd5e1;
            border-color: #2d7aff;
            transform: scale(1.05);
        }
        [data-theme="dark"] .modal-card .variaveis-preview .tag-var-modal {
            background: #2d3a4f;
            color: #b8c9e0;
        }
        [data-theme="dark"] .modal-card .variaveis-preview .tag-var-modal:hover {
            background: #3b4a62;
            border-color: #5a8aff;
        }
        .modal-card .feedback {
            font-size: 12px;
            color: #b91c1c;
            margin-top: 5px;
            display: none;
        }
        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .modal-actions .btn {
            flex: 1;
            justify-content: center;
            min-width: 70px;
        }

        /* ===== MODAL DE VISUALIZAÇÃO ===== */
        .view-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 20, 40, 0.6);
            backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            z-index: 1100;
            padding: 20px;
        }
        .view-modal-overlay.ativo {
            display: flex;
        }
        .view-modal-card {
            background: #fff;
            max-width: 520px;
            width: 100%;
            border-radius: 24px;
            padding: 24px 28px 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            animation: modalIn 0.2s ease;
        }
        [data-theme="dark"] .view-modal-card {
            background: #1e293b;
            color: #e6edf5;
        }
        .view-modal-card h3 {
            font-size: 17px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #0b2b44;
        }
        [data-theme="dark"] .view-modal-card h3 {
            color: #e6edf5;
        }
        .view-modal-card h3 i {
            color: #2d7aff;
        }
        .view-modal-card .view-subtitle {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 14px;
            border-bottom: 1px solid #eef2f8;
            padding-bottom: 10px;
        }
        [data-theme="dark"] .view-modal-card .view-subtitle {
            color: #8fa3be;
            border-bottom-color: #2d3a4f;
        }
        .view-modal-card .view-body {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px 18px;
            font-size: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #eef2f8;
            min-height: 80px;
        }
        [data-theme="dark"] .view-modal-card .view-body {
            background: #0f1729;
            border-color: #2d3a4f;
            color: #e6edf5;
        }
        .view-modal-card .view-body::-webkit-scrollbar {
            width: 4px;
        }
        .view-modal-card .view-body::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        [data-theme="dark"] .view-modal-card .view-body::-webkit-scrollbar-thumb {
            background: #3b4a62;
        }
        .view-modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .view-modal-actions .btn {
            flex: 1;
            justify-content: center;
            min-width: 80px;
        }
        .view-feedback {
            font-size: 12px;
            color: #16a34a;
            display: none;
            align-items: center;
            gap: 4px;
            margin-left: 8px;
        }
        .view-feedback.ativo {
            display: inline-flex;
        }

        /* ===== CALCULADORA ===== */
        .calc-toggle-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a4cff, #2d7aff);
            color: white;
            border: none;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(26, 76, 255, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .calc-toggle-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 30px rgba(26, 76, 255, 0.45);
        }
        .calc-toggle-btn.active {
            background: #e74c3c;
            transform: rotate(45deg);
        }
        .calc-toggle-btn.active:hover {
            transform: rotate(45deg) scale(1.08);
        }

        .calc-panel {
            position: fixed;
            bottom: 86px;
            right: 24px;
            width: 290px;
            background: #ffffff;
            border-radius: 18px;
            padding: 18px 20px 18px;
            box-shadow: 0 16px 60px rgba(0, 20, 40, 0.2);
            z-index: 550;
            display: none;
            opacity: 0;
            transform: translateY(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        [data-theme="dark"] .calc-panel {
            background: #1e293b;
            box-shadow: 0 16px 60px rgba(0, 0, 0, 0.5);
            border-color: #3b4a62;
        }
        .calc-panel.aberto {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        .calc-panel h3 {
            font-size: 13px;
            font-weight: 600;
            color: #1f3349;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        [data-theme="dark"] .calc-panel h3 {
            color: #d6e0ee;
        }
        .calc-panel h3::before {
            content: "⏰";
            font-size: 16px;
        }
        .calc-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            align-items: center;
        }
        .calc-row label {
            font-size: 11px;
            font-weight: 500;
            color: #52677a;
            margin: 0;
            min-width: 32px;
        }
        [data-theme="dark"] .calc-row label {
            color: #8fa3be;
        }
        .calc-row input[type="time"] {
            flex: 1;
            padding: 6px 8px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 13px;
            font-family: "Inter", monospace;
            background: #fafcff;
            transition: 0.15s;
            min-width: 0;
        }
        [data-theme="dark"] .calc-row input[type="time"] {
            background: #0f1729;
            border-color: #3b4a62;
            color: #e6edf5;
        }
        .calc-row input[type="time"]:focus {
            border-color: #2d7aff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(45, 122, 255, 0.12);
        }
        .calc-row input[type="number"] {
            width: 42px;
            padding: 6px 2px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            font-family: "Inter", monospace;
            background: #fafcff;
            transition: 0.15s;
        }
        [data-theme="dark"] .calc-row input[type="number"] {
            background: #0f1729;
            border-color: #3b4a62;
            color: #e6edf5;
        }
        .calc-row input[type="number"]:focus {
            border-color: #2d7aff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(45, 122, 255, 0.12);
        }
        .calc-row span {
            font-size: 12px;
            color: #52677a;
            font-weight: 500;
        }
        [data-theme="dark"] .calc-row span {
            color: #8fa3be;
        }
        .calc-resultado {
            margin-top: 10px;
            padding: 10px 12px;
            background: #f2f7fe;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: #1a4cff;
            font-family: "Inter", monospace;
            letter-spacing: 1px;
        }
        [data-theme="dark"] .calc-resultado {
            background: #1f2a3e;
            color: #5a8aff;
        }
        .calc-comparacao {
            font-size: 12px;
            color: #52677a;
            margin-top: 4px;
            text-align: center;
            min-height: 18px;
        }
        [data-theme="dark"] .calc-comparacao {
            color: #8fa3be;
        }
        .calc-comparacao .atraso {
            color: #e74c3c;
            font-weight: 600;
        }
        .calc-comparacao .adiantado {
            color: #27ae60;
            font-weight: 600;
        }
        .calc-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }
        .calc-actions button {
            flex: 1;
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 40px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .calc-calcular-btn {
            background: #1a4cff;
            color: white;
        }
        .calc-calcular-btn:hover {
            background: #0e3fd6;
        }
        .calc-limpar-btn {
            background: #eef2f6;
            color: #1f3349;
        }
        [data-theme="dark"] .calc-limpar-btn {
            background: #2d3a4f;
            color: #d6e0ee;
        }
        .calc-limpar-btn:hover {
            background: #dce4ed;
        }
        [data-theme="dark"] .calc-limpar-btn:hover {
            background: #3b4a62;
        }

        /* ===== CRONÔMETROS ===== */
        .cronometro-fab {
            position: fixed;
            bottom: 24px;
            right: 80px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #3d6bff;
            color: #fff;
            border: none;
            font-size: 19px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(26, 76, 255, 0.28);
            z-index: 1500;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .cronometro-fab:hover {
            transform: scale(1.06);
            box-shadow: 0 6px 18px rgba(26, 76, 255, 0.38);
        }
        .cronometro-fab:active {
            transform: scale(0.94);
        }

        .cronometros-container {
            position: fixed;
            bottom: 80px;
            right: 80px;
            display: flex;
            flex-direction: row-reverse;
            flex-wrap: wrap-reverse;
            justify-content: flex-start;
            align-content: flex-end;
            gap: 5px;
            z-index: 1400;
            max-width: min(70vw, 600px);
            max-height: 28vh;
            overflow-y: auto;
            padding: 2px;
        }

        .cronometro-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(6px);
            border-radius: 10px;
            padding: 5px 6px 5px 10px;
            width: auto;
            max-width: 170px;
            box-shadow: 0 4px 14px rgba(0, 20, 40, 0.10);
            border: 1px solid rgba(11, 26, 46, 0.08);
            transition: box-shadow 0.3s, border-color 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        [data-theme="dark"] .cronometro-card {
            background: rgba(30, 41, 59, 0.92);
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
        }
        .cronometro-card.cronometro-pausado {
            opacity: 0.6;
        }
        .cronometro-card.cronometro-notificado {
            border-color: #1a4cff;
            box-shadow: 0 0 0 2px rgba(26, 76, 255, 0.3), 0 4px 14px rgba(0, 20, 40, 0.10);
        }
        .cronometro-card-main {
            display: flex;
            flex-direction: column;
            min-width: 0;
            flex: 1;
        }
        .cronometro-card-header {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .cronometro-nome {
            font-size: 10px;
            font-weight: 600;
            color: #52677a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80px;
        }
        [data-theme="dark"] .cronometro-nome {
            color: #93a6bd;
        }
        .cronometro-tempo {
            font-size: 14px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.2px;
            color: #0b1a2e;
            line-height: 1.2;
        }
        [data-theme="dark"] .cronometro-tempo {
            color: #e6edf5;
        }
        .cronometro-acoes {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }
        .cronometro-pausar,
        .cronometro-fechar {
            background: transparent;
            border: none;
            color: #8fa3be;
            font-size: 12px;
            cursor: pointer;
            line-height: 1;
            padding: 4px;
            border-radius: 6px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cronometro-pausar:hover {
            background: #eef2f6;
            color: #1f3349;
        }
        .cronometro-fechar:hover {
            background: #eef2f6;
            color: #d64545;
        }
        [data-theme="dark"] .cronometro-pausar:hover,
        [data-theme="dark"] .cronometro-fechar:hover {
            background: #2d3a4f;
            color: #d6e0ee;
        }

        .cronometro-popup-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(11, 26, 46, 0.45);
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .cronometro-popup-overlay.ativo {
            display: flex;
        }
        .cronometro-popup-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 20px 22px 18px;
            width: 300px;
            max-width: 90vw;
            box-shadow: 0 16px 40px rgba(0, 20, 40, 0.25);
        }
        [data-theme="dark"] .cronometro-popup-card {
            background: #1e293b;
        }
        .cronometro-popup-card h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #0b1a2e;
        }
        [data-theme="dark"] .cronometro-popup-card h3 {
            color: #e6edf5;
        }
        .cronometro-popup-card label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #1f3349;
        }
        [data-theme="dark"] .cronometro-popup-card label {
            color: #b8c9e0;
        }
        .cronometro-popup-card input[type="text"] {
            width: 100%;
            border: 1px solid #dce4ed;
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 13px;
            font-family: inherit;
            margin-bottom: 4px;
            background: #f9fbfd;
            color: inherit;
        }
        [data-theme="dark"] .cronometro-popup-card input[type="text"] {
            border-color: #3b4a62;
            background: #16202f;
        }

        .cronometro-config-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #e2e8f0;
        }
        [data-theme="dark"] .cronometro-config-row {
            border-top-color: #3b4a62;
        }
        .cronometro-config-row label {
            font-size: 11px;
            font-weight: 500;
            margin: 0;
            color: #52677a;
            min-width: 36px;
        }
        [data-theme="dark"] .cronometro-config-row label {
            color: #8fa3be;
        }
        .cronometro-config-row input[type="number"] {
            width: 50px;
            padding: 5px 2px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
            font-family: "Inter", monospace;
            background: #fafcff;
            transition: 0.15s;
        }
        [data-theme="dark"] .cronometro-config-row input[type="number"] {
            background: #0f1729;
            border-color: #3b4a62;
            color: #e6edf5;
        }
        .cronometro-config-row input[type="number"]:focus {
            border-color: #2d7aff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(45, 122, 255, 0.12);
        }
        .cronometro-config-row span {
            font-size: 11px;
            color: #798ea5;
        }
        [data-theme="dark"] .cronometro-config-row span {
            color: #8fa3be;
        }

        .cronometro-popup-feedback {
            font-size: 11px;
            color: #d64545;
            min-height: 14px;
            margin-top: 4px;
        }

        .cronometro-popup-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 10px;
        }
        .cronometro-popup-actions button {
            border-radius: 30px;
            padding: 7px 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        #cronometroIniciarBtn {
            background: #1a4cff;
            color: #fff;
            border: none;
        }
        #cronometroIniciarBtn:hover {
            background: #0e3fd6;
        }
        #cronometroCancelarBtn {
            background: transparent;
            border: 1px solid #dce4ed;
            color: #1f3349;
        }
        [data-theme="dark"] #cronometroCancelarBtn {
            border-color: #3b4a62;
            color: #b8c9e0;
        }

        .cronometro-toast {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #1a4cff;
            color: #fff;
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            z-index: 3000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            box-shadow: 0 10px 30px rgba(26, 76, 255, 0.4);
        }
        .cronometro-toast.ativo {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 768px) {
            .top-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
                padding: 8px 12px;
                min-height: auto;
            }
            .top-bar .variaveis-row {
                flex-wrap: wrap;
                justify-content: flex-start;
            }
            .top-bar .campo-var {
                min-width: 60px;
                flex: 1;
            }
            .top-bar .campo-var.cliente {
                min-width: 80px;
            }
            .top-bar .acoes-topo {
                justify-content: flex-end;
            }
            .cards-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 10px;
            }
            .sticky-note-float {
                width: 260px !important;
                min-width: 140px;
                height: 200px !important;
            }
            .calc-panel {
                width: 260px;
                right: 14px;
                bottom: 80px;
            }
            .calc-toggle-btn {
                bottom: 18px;
                right: 14px;
                width: 44px;
                height: 44px;
                font-size: 18px;
            }
            .cronometro-fab {
                bottom: 18px;
                right: 66px;
                width: 44px;
                height: 44px;
                font-size: 17px;
            }
            .cronometros-container {
                bottom: 70px;
                right: 66px;
                max-width: 80vw;
                max-height: 26vh;
            }
            .view-modal-card {
                max-width: 95%;
                padding: 18px 16px;
            }
        }

        @media (max-width: 480px) {
            .top-bar {
                padding: 6px 8px;
                gap: 4px;
            }
            .top-bar .variaveis-row {
                gap: 4px;
            }
            .top-bar .campo-var input {
                font-size: 10px;
                padding: 2px 5px;
                min-width: 40px;
            }
            .top-bar .campo-var label {
                font-size: 7px;
            }
            .top-bar .logo {
                font-size: 13px;
            }
            .cards-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .msg-card {
                padding: 8px 10px;
                min-height: 60px;
            }
            .msg-card .card-titulo {
                font-size: 11px;
            }
            .msg-card .card-preview {
                font-size: 10px;
                -webkit-line-clamp: 1;
            }
            .sticky-note-float {
                width: 200px !important;
                min-width: 110px;
                height: 160px !important;
                padding: 8px 8px 6px;
            }
            .sticky-body textarea {
                font-size: 11px;
                padding: 5px 8px;
            }
            .calc-panel {
                width: 220px !important;
                right: 8px;
                bottom: 70px;
                padding: 12px 14px;
            }
            .calc-toggle-btn {
                width: 40px;
                height: 40px;
                font-size: 16px;
                bottom: 12px;
                right: 8px;
            }
            .cronometro-fab {
                bottom: 12px;
                right: 56px;
                width: 40px;
                height: 40px;
                font-size: 15px;
            }
            .cronometros-container {
                bottom: 60px;
                right: 56px;
                max-width: 88vw;
                max-height: 22vh;
            }
            .modal-card {
                padding: 14px 14px;
            }
            .view-modal-card {
                padding: 14px 12px;
            }
            .view-modal-card .view-body {
                font-size: 13px;
                padding: 12px 14px;
                max-height: 200px;
            }
            .btn {
                font-size: 10px;
                padding: 3px 7px;
            }
            .btn i {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== BARRA SUPERIOR FIXA ===== -->
    <div class="top-bar">
        <div class="logo">
            <i class="fas fa-user-check"></i> Facilitador
        </div>

        <div class="variaveis-row">
            <!-- Nome do Cliente (primeiro) -->
            <div class="campo-var cliente">
                <label>👤 Nome</label>
                <input type="text" id="nomeCliente" placeholder="Nome do cliente" />
            </div>
            <!-- Início -->
            <div class="campo-var">
                <label>📅 Início</label>
                <input type="date" id="dataInicio" />
            </div>
            <!-- Fim -->
            <div class="campo-var">
                <label>📅 Fim</label>
                <input type="date" id="dataFim" />
            </div>
        </div>

        <div class="acoes-topo">
            <button class="btn btn-primary" id="btnNovaMsg"><i class="fas fa-plus"></i> Nova</button>
            <button class="btn btn-outline" id="btnExportar" title="Exportar mensagens"><i class="fas fa-download"></i></button>
            <button class="btn btn-outline" id="btnImportar" title="Importar mensagens"><i class="fas fa-upload"></i></button>
            <button class="btn btn-outline" id="btnLimparVariaveis" title="Limpar variáveis"><i class="fas fa-eraser"></i></button>
            <button class="theme-toggle" id="themeToggle">🌓</button>
            <input type="file" id="importarInput" accept=".json" style="display:none" />
        </div>
    </div>

    <!-- ===== ÁREA DE CONTEÚDO ===== -->
    <div class="content-area">
        <div class="cards-grid" id="listaMensagens">
            <div class="vazio-msg" id="vazioMsg">Nenhuma mensagem. Clique em "Nova" para criar.</div>
        </div>
    </div>

    <!-- ===== TOAST FEEDBACK ===== -->
    <div class="toast-feedback" id="toastFeedback"></div>

    <!-- ===== BLOCO DE NOTAS FLUTUANTE ===== -->
    <div class="sticky-note-float" id="stickyNoteFloat" style="left: auto; right: 24px; bottom: 24px;">
        <div class="sticky-header" id="stickyHeader">
            <label>Bloco de notas</label>
            <div class="sticky-actions">
                <button class="minimizar-btn" id="minimizarStickyBtn" title="Minimizar/Expandir">▼</button>
                <button id="limparStickyBtn" title="Limpar nota">🗑</button>
            </div>
        </div>
        <div class="sticky-body">
            <textarea id="stickyNoteText" placeholder="Digite algo aqui... (salvo automaticamente)"></textarea>
            <div class="sticky-status" id="stickyNoteStatus">Salvo automaticamente</div>
        </div>
    </div>

    <!-- ===== CALCULADORA ===== -->
    <button class="calc-toggle-btn" id="calcToggleBtn" title="Calculadora de horários">⏰</button>
    <div class="calc-panel" id="calcPanel">
        <h3>Calculadora de Horários</h3>
        <div class="calc-row">
            <label>Início</label>
            <input type="time" id="calcHoraInicial" value="" />
        </div>
        <div class="calc-row">
            <label>+</label>
            <input type="number" id="calcHoras" value="1" min="0" max="99" style="width:42px;" />
            <span>h</span>
            <input type="number" id="calcMinutos" value="10" min="0" max="59" style="width:42px;" />
            <span>min</span>
        </div>
        <div class="calc-row" style="margin-top:4px;">
            <label>Chegou</label>
            <input type="time" id="calcChegada" placeholder="Opcional" />
        </div>
        <div class="calc-resultado" id="calcResultado">--:--</div>
        <div class="calc-comparacao" id="calcComparacao">Insira um horário inicial</div>
        <div class="calc-actions">
            <button class="calc-calcular-btn" id="calcCalcularBtn">Calcular</button>
            <button class="calc-limpar-btn" id="calcLimparBtn">Limpar</button>
        </div>
    </div>

    <!-- ===== CRONÔMETROS ===== -->
    <div id="cronometrosContainer" class="cronometros-container"></div>

    <!-- ===== POPUP NOVO CRONÔMETRO ===== -->
    <div class="cronometro-popup-overlay" id="cronometroPopupOverlay">
        <div class="cronometro-popup-card">
            <h3>⏱ Novo cronômetro</h3>
            <label for="cronometroNomeInput">Nome do cronômetro</label>
            <input type="text" id="cronometroNomeInput" placeholder="Ex: Aguardando cliente" maxlength="40" />

            <div class="cronometro-config-row">

                <span>minutos</span>
            </div>

            <div class="cronometro-popup-feedback" id="cronometroPopupFeedback"></div>

            <div class="cronometro-popup-actions">
